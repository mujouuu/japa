<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japonês Essencial N5-N3 — Frequência 500% · Frases e Gramática</title>
    <style>
        :root {
            --bg: #060610;
            --surface: #0e0e1e;
            --surface2: #161630;
            --text: #e8e8f4;
            --text2: #a0a0b8;
            --accent: #d32f2f;
            --accent2: #f44336;
            --gold: #e6b800;
            --blue: #5c9cef;
            --green: #4caf84;
            --purple: #9c7cec;
            --border: #222240;
            --radius: 10px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6, 6, 16, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 8px 14px;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .logo {
            font-weight: 900;
            font-size: 1rem;
            color: #fff;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }
        .logo span {
            color: var(--accent2);
        }
        .search-box {
            flex: 1;
            min-width: 160px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.08);
        }
        .search-box input::placeholder {
            color: #555;
        }
        .stats {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: var(--text2);
        }
        .stats span {
            background: var(--surface2);
            padding: 3px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 14px;
        }
        .controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .filter-btn {
            padding: 5px 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text2);
            cursor: pointer;
            font-size: 0.68rem;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover {
            border-color: #555;
            color: #fff;
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .word-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: 0.2s;
        }
        .word-card:hover {
            border-color: #444;
        }
        .word-card.grammar-card {
            border-left: 3px solid #8e44ad;
        }
        .word-card.particle-card {
            border-left: 3px solid var(--gold);
        }
        .word-card.verb-card {
            border-left: 3px solid var(--accent2);
        }
        .word-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            cursor: pointer;
            user-select: none;
            flex-wrap: wrap;
        }
        .word-header .rank {
            font-size: 0.65rem;
            color: #555;
            min-width: 26px;
            font-weight: 700;
            text-align: right;
        }
        .word-header .kanji {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            min-width: 50px;
        }
        .word-header .kana {
            font-size: 0.75rem;
            color: var(--text2);
            min-width: 60px;
        }
        .word-header .meaning {
            font-size: 0.8rem;
            color: #ccc;
            flex: 1;
            min-width: 90px;
        }
        .word-header .arrow {
            font-size: 0.6rem;
            color: #444;
            transition: transform 0.3s;
        }
        .word-card.open .word-header .arrow {
            transform: rotate(180deg);
        }
        .word-body {
            display: none;
            padding: 0 12px 12px;
            border-top: 1px solid var(--border);
            animation: slideDown 0.3s ease;
        }
        .word-card.open .word-body {
            display: block;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .example-set {
            background: var(--surface2);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
            border-left: 3px solid var(--blue);
        }
        .example-set .jp {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 3px;
            line-height: 1.7;
        }
        .example-set .romaji {
            font-size: 0.7rem;
            color: #777;
            font-style: italic;
            margin-bottom: 2px;
        }
        .example-set .translation {
            font-size: 0.78rem;
            color: #bbb;
            margin-bottom: 2px;
        }
        .example-set.q {
            border-left-color: var(--accent2);
        }
        .example-set.q .jp {
            color: #ffaaaa;
        }
        .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 8px 0 4px;
        }
        .line-explanation {
            font-size: 0.74rem;
            color: #999;
            line-height: 1.7;
            padding-left: 8px;
            border-left: 2px solid #2a2a40;
        }
        .line-explanation strong {
            color: var(--accent2);
        }
        .line-explanation em {
            color: var(--gold);
            font-style: normal;
        }
        .line-explanation b {
            color: #5c9cef;
        }
        .tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 0.58rem;
            font-weight: 700;
            margin-right: 2px;
        }
        .tag-n5 {
            background: #1a3a1a;
            color: #4caf50;
        }
        .tag-n4 {
            background: #1a2a3a;
            color: #64b5f6;
        }
        .tag-n3 {
            background: #3a2a0a;
            color: #ffb74d;
        }
        .tag-grammar {
            background: #2a0a3a;
            color: #d7bde2;
        }
        .tag-particle {
            background: #3a2a00;
            color: #ffd54f;
        }
        .tag-verb {
            background: #3a0a0a;
            color: #ef5350;
        }
        .no-results {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 1rem;
            display: none;
        }
        .load-more {
            text-align: center;
            margin: 14px 0;
        }
        .load-more button {
            padding: 9px 20px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .load-more button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }
        @media (max-width: 600px) {
            .word-header {
                gap: 5px;
                padding: 8px 10px;
            }
            .word-header .kanji {
                font-size: 0.95rem;
                min-width: 38px;
            }
            .word-header .kana {
                font-size: 0.68rem;
                min-width: 45px;
            }
            .word-header .meaning {
                font-size: 0.72rem;
            }
            .example-set .jp {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-inner">
            <div class="logo">日本語 <span>500%</span> · N5→N3</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar palavra, kanji, gramática, português...">
            </div>
            <div class="stats">
                <span id="visibleCount">~600 itens</span>
                <span id="filterLabel">Todos</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="controls" id="filterControls">
            <button class="filter-btn active" data-level="all">📚 Todos</button>
            <button class="filter-btn" data-level="n5">🟢 N5</button>
            <button class="filter-btn" data-level="n4">🔵 N4</button>
            <button class="filter-btn" data-level="n3">🟠 N3</button>
            <button class="filter-btn" data-level="particle">📌 Partículas</button>
            <button class="filter-btn" data-level="grammar">🧩 Gramática</button>
            <button class="filter-btn" data-level="verb">⚡ Verbos</button>
            <button class="filter-btn" data-level="conversation">💬 Conversação</button>
        </div>
        <div class="word-list" id="wordList"></div>
        <div class="load-more" id="loadMoreArea">
            <button id="loadMoreBtn">Mostrar mais 30 ▼</button>
        </div>
        <div class="no-results" id="noResults">🔍 Nenhum item encontrado. Tente outro termo.</div>
    </div>

    <script>
        (function() {
            const data = [
                // ==================== PARTÍCULAS ESSENCIAIS ====================
                [1, "は", "は", "partícula de tópico (wa)", "n5", "particle", [
                        ["私は学生です。", "Eu sou estudante."],
                        ["日本語は面白いです。", "Japonês é interessante."],
                        ["今日は何曜日ですか？", "Que dia da semana é hoje?"],
                        ["あなたは日本人ですか？", "Você é japonês(a)?"],
                        ["これは誰のペンですか？", "De quem é esta caneta?"]
                    ],
                    `<strong>は</strong> (lê-se <em>wa</em>) marca o <strong>tópico</strong> da frase — aquilo sobre o qual se fala.<br><br>
<b>🔹 QUANDO USAR:</b> Sempre que quiser estabelecer <strong>sobre o quê</strong> você está falando. É a partícula mais fundamental do japonês. Use para:<br>
• Identificar/se apresentar: 私は〜です (Eu sou ~)<br>
• Descrever características do tópico<br>
• Contrastar com outras possibilidades (ênfase)<br><br>
<b>🔹 COMO USAR — PASSO A PASSO:</b><br>
1️⃣ Escolha o <strong>tópico</strong> (substantivo ou pronome)<br>
2️⃣ Anexe <strong>は</strong> (escreve-se は mas lê-se WA)<br>
3️⃣ Depois do は, coloque a <strong>informação</strong> sobre o tópico<br>
4️⃣ Termine com です/ます (polido) ou forma informal<br>
5️⃣ Em perguntas, o は continua no mesmo lugar; a partícula か no final torna a frase interrogativa<br><br>
<b>🔹 CUIDADO:</b> は NÃO marca o objeto direto (para isso use を). は e が têm papéis diferentes: は = tópico (o assunto geral), が = sujeito gramatical (quem faz a ação).<br><br>
<b>🔹 DICA:</b> Pense em は como "falando de X..." — você anuncia o tema e depois diz algo sobre ele.`
                ],
                [2, "が", "が", "partícula de sujeito / mas", "n5", "particle", [
                        ["雨が降っています。", "Está chovendo."],
                        ["誰が来ますか？", "Quem vem?"],
                        ["猫が好きですが、犬は嫌いです。", "Gosto de gatos, mas não gosto de cachorros."],
                        ["何が食べたいですか？", "O que você quer comer?"],
                        ["お金がありますか？", "Você tem dinheiro?"]
                    ],
                    `<strong>が</strong> marca o <strong>sujeito gramatical</strong> e também funciona como <strong>conjunção adversativa</strong> ('mas').<br><br>
<b>🔹 QUANDO USAR COMO SUJEITO:</b><br>
• Com verbos de <strong>existência</strong>: ある (objetos), いる (seres vivos)<br>
• Com verbos de <strong>desejo</strong>: 〜たい (querer fazer)<br>
• Com <strong>habilidade</strong>: できる、上手、下手<br>
• Com <strong>gostar/desgostar</strong>: 好き、嫌い<br>
• Para responder a perguntas com 誰が (quem?) ou 何が (o quê?)<br>
• Para <strong>ênfase no sujeito</strong> (foco em QUEM fez algo)<br><br>
<b>🔹 QUANDO USAR COMO 'MAS':</b><br>
• No meio da frase para conectar duas orações contrastantes<br>
• A frase antes do が e a depois são independentes<br><br>
<b>🔹 PASSO A PASSO (sujeito):</b><br>
1️⃣ Identifique o <strong>sujeito</strong> da ação ou estado<br>
2️⃣ Anexe <strong>が</strong> ao sujeito<br>
3️⃣ Coloque o verbo/adjetivo depois<br>
4️⃣ Ex: 猫<strong>が</strong>いる (Há um gato / O gato existe)<br><br>
<b>🔹 PASSO A PASSO ('mas'):</b><br>
1️⃣ Escreva a primeira oração (forma informal ou polida)<br>
2️⃣ Adicione <strong>が</strong><br>
3️⃣ Escreva a segunda oração<br>
4️⃣ Ex: 高い<strong>が</strong>、美味しい (É caro, mas é gostoso)<br><br>
<b>🔹 DICA CRUCIAL:</b> Com 好き/嫌い/できる/〜たい, o objeto usa が (não を)! 猫<strong>が</strong>好き = Gosto de gatos.`
                ],
                [3, "を", "を", "partícula de objeto direto", "n5", "particle", [
                        ["毎朝パンを食べます。", "Como pão toda manhã."],
                        ["日本語を勉強しています。", "Estou estudando japonês."],
                        ["何をしていますか？", "O que você está fazendo?"],
                        ["この本を読んだことがありますか？", "Você já leu este livro?"],
                        ["窓を開けてもいいですか？", "Posso abrir a janela?"]
                    ],
                    `<strong>を</strong> (lê-se 'o') marca o <strong>objeto direto</strong> — aquilo que recebe a ação do verbo.<br><br>
<b>🔹 QUANDO USAR:</b><br>
• Com verbos transitivos: 食べる、見る、読む、買う、する、開ける、閉める...<br>
• Para indicar o <strong>local de passagem</strong> com verbos de movimento: 道を歩く (andar pela rua), 公園を散歩する (passear pelo parque)<br>
• Para indicar o <strong>ponto de saída</strong>: 家を出る (sair de casa), 電車を降りる (descer do trem)<br><br>
<b>🔹 PASSO A PASSO:</b><br>
1️⃣ Identifique o <strong>objeto</strong> que recebe a ação<br>
2️⃣ Anexe <strong>を</strong> ao objeto<br>
3️⃣ Coloque o <strong>verbo transitivo</strong> depois<br>
4️⃣ Ex: 本<strong>を</strong>読む (Ler livro)<br>
5️⃣ Na forma polida: 本<strong>を</strong>読みます<br><br>
<b>🔹 CUIDADO:</b> Verbos como 好き、できる、分かる NÃO usam を — eles usam が para o objeto!<br>
<b>🔹 DICA:</b> Se o verbo responde à pergunta "o quê?" (O quê você come? → pão), use を.`
                ],
                [4, "に", "に", "localização / direção / tempo / alvo", "n5", "particle", [
                        ["7時に起きます。", "Acordo às 7h."],
                        ["学校に行きます。", "Vou à escola."],
                        ["机の上に本があります。", "Há um livro em cima da mesa."],
                        ["何時に寝ますか？", "A que horas você dorme?"],
                        ["友達にプレゼントをあげました。", "Dei um presente ao amigo."]
                    ],
                    `<strong>に</strong> é a partícula mais versátil do japonês. Tem <b>4 usos principais</b>:<br><br>
<b>🔹 USO 1 — PONTO TEMPORAL (quando algo acontece):</b><br>
• Use para horas específicas: 7時<strong>に</strong> (às 7h)<br>
• Dias da semana: 月曜日<strong>に</strong> (na segunda)<br>
• Datas: 1月10日<strong>に</strong> (em 10 de janeiro)<br>
⚠️ NÃO use に para: 今日、明日、毎日、今、いつ (palavras temporais relativas)<br><br>
<b>🔹 USO 2 — DESTINO/DIREÇÃO (com verbos de movimento):</b><br>
• Verbos: 行く、来る、帰る、戻る、着く<br>
• Ex: 日本<strong>に</strong>行く (Ir ao Japão)<br>
• Também pode usar へ (mais poético/formal)<br><br>
<b>🔹 USO 3 — LOCAL DE EXISTÊNCIA (com ある/いる):</b><br>
• Ex: 机の上<strong>に</strong>本がある (Há um livro em cima da mesa)<br>
• Ex: 公園<strong>に</strong>子供がいる (Há crianças no parque)<br><br>
<b>🔹 USO 4 — ALVO/RECIPIENTE (a quem se dirige a ação):</b><br>
• Verbos: あげる、くれる、教える、会う、話す、聞く<br>
• Ex: 友達<strong>に</strong>あげる (Dar ao amigo)<br><br>
<b>🔹 PASSO A PASSO GERAL:</b><br>
1️⃣ Decida qual dos 4 usos se aplica<br>
2️⃣ Coloque <strong>に</strong> após o substantivo de tempo/local/alvo<br>
3️⃣ Complete com o verbo adequado<br>
4️⃣ Para tempo: <strong>に</strong> vai logo após a expressão temporal<br>
5️⃣ Para local: <strong>に</strong> vai após o local + verbo de existência ou movimento`
                ],
                [5, "で", "で", "local de ação / meio / causa", "n5", "particle", [
                        ["図書館で勉強します。", "Estudo na biblioteca."],
                        ["電車で会社に行きます。", "Vou de trem para a empresa."],
                        ["どこで食べましょうか？", "Onde vamos comer?"],
                        ["何で来ましたか？", "Como você veio?"],
                        ["病気で学校を休みました。", "Faltei à escola por doença."]
                    ],
                    `<strong>で</strong> tem <b>3 usos principais</b>:<br><br>
<b>🔹 USO 1 — LOCAL DA AÇÃO (onde a ação acontece):</b><br>
• Diferente de に (local de existência), で marca onde uma <strong>atividade</strong> ocorre<br>
• Ex: 図書館<strong>で</strong>勉強する (Estudar NA biblioteca — ação)<br>
• Compare: 図書館<strong>に</strong>本がある (Há livro NA biblioteca — existência)<br>
• Verbos comuns: 食べる、飲む、働く、買う、遊ぶ、待つ<br><br>
<b>🔹 USO 2 — MEIO/INSTRUMENTO (como se faz):</b><br>
• Transporte: 電車<strong>で</strong> (de trem), 車<strong>で</strong> (de carro)<br>
• Instrumento: 箸<strong>で</strong> (com hashi), ペン<strong>で</strong> (com caneta)<br>
• Idioma: 日本語<strong>で</strong> (em japonês)<br><br>
<b>🔹 USO 3 — CAUSA/MOTIVO:</b><br>
• Ex: 病気<strong>で</strong>休む (Faltar por doença)<br>
• Ex: 雨<strong>で</strong>中止 (Cancelado por causa da chuva)<br><br>
<b>🔹 PASSO A PASSO:</b><br>
1️⃣ Pergunte-se: é <strong>local de ação</strong>, <strong>meio</strong> ou <strong>causa</strong>?<br>
2️⃣ Anexe <strong>で</strong> ao substantivo (local/meio/causa)<br>
3️⃣ Coloque o verbo de ação depois<br>
4️⃣ Ex (local): カフェ<strong>で</strong>コーヒーを飲む (Beber café NO café)<br>
5️⃣ Ex (meio): バス<strong>で</strong>行く (Ir DE ônibus)<br><br>
<b>🔹 DICA CRUCIAL:</b> に = existência, で = ação. Se tem atividade acontecendo, use で!`
                ],
                [6, "と", "と", "e / com / citação", "n5", "particle", [
                        ["パンと卵を食べます。", "Como pão e ovo."],
                        ["友達と映画を見ました。", "Assisti a um filme com um amigo."],
                        ["彼は「行く」と言いました。", "Ele disse 'vou'."],
                        ["誰と来ましたか？", "Com quem você veio?"],
                        ["これとそれ、どちらがいいですか？", "Qual você prefere, este ou esse?"]
                    ],
                    `<strong>と</strong> tem <b>3 usos</b>:<br><br>
<b>🔹 USO 1 — LISTA EXAUSTIVA (e):</b><br>
• Conecta substantivos: A<strong>と</strong>B = A e B<br>
• É uma lista COMPLETA (todos os itens mencionados)<br>
• Ex: パン<strong>と</strong>卵 = pão e ovo (só esses dois)<br>
• Diferente de や (lista parcial: AやB = coisas como A e B)<br><br>
<b>🔹 USO 2 — COMPANHIA (com):</b><br>
• Pessoa com quem se faz algo: 友達<strong>と</strong> = com o amigo<br>
• Ex: 彼女<strong>と</strong>話す (Conversar com a namorada)<br>
• Para "e" entre pessoas, também se usa と<br><br>
<b>🔹 USO 3 — CITAÇÃO (marca fala/pensamento):</b><br>
• Antes de verbos como 言う、思う、書く、聞く<br>
• Ex: 「大丈夫」<strong>と</strong>言った (Disse 'tudo bem')<br>
• O conteúdo citado vai ANTES do と<br><br>
<b>🔹 PASSO A PASSO:</b><br>

            const fullData = [...data];

            moreData.forEach(w => {
                fullData.push([rank, w[0], w[1], w[2], w[3], w[4], w[5], w[6] || ""]);
                rank++;
            });

            const wordList = document.getElementById('wordList');
            const searchInput = document.getElementById('searchInput');
            const visibleCount = document.getElementById('visibleCount');
            const filterLabel = document.getElementById('filterLabel');
            const noResults = document.getElementById('noResults');
            const loadMoreArea = document.getElementById('loadMoreArea');
            const loadMoreBtn = document.getElementById('loadMoreBtn');

            let currentFilter = 'all';
            let displayCount = 30;
            let filteredVocab = [...fullData];

            function applyFilter() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                filteredVocab = fullData.filter(item => {
                    const [rank, kanji, kana, meaning, level, type, examples, explanation] = item;
                    const allText = [kanji, kana, meaning, (explanation || '')].join(' ').toLowerCase();
                    const matchesSearch = !searchTerm || allText.includes(searchTerm) || (examples &&
                        examples.some(e => e[0].includes(searchTerm) || e[1].toLowerCase().includes(
                            searchTerm)));
                    const matchesFilter = currentFilter === 'all' || level === currentFilter || type ===
                        currentFilter;
                    return matchesSearch && matchesFilter;
                });
                displayCount = 30;
                renderWords();
                updateStats();
            }

            function renderWords() {
                const slice = filteredVocab.slice(0, displayCount);
                wordList.innerHTML = slice.map(item => {
                    const [rank, kanji, kana, meaning, level, type, examples, explanation] = item;
                    const hasDetail = explanation && explanation.length > 20;
                    const cardClass = type === 'grammar' ? 'grammar-card' : (type === 'particle' ?
                        'particle-card' : (type === 'verb' ? 'verb-card' : ''));
                    const tagClass = type === 'grammar' ? 'tag-grammar' : (type === 'particle' ? 'tag-particle' :
                        (type === 'verb' ? 'tag-verb' : `tag-${level}`));
                    const tagText = type === 'grammar' ? 'GRAM' : (type === 'particle' ? 'PART' : (type ===
                        'verb' ? 'VERB' : level.toUpperCase()));
                    let examplesHTML = '';
                    if (examples && examples.length > 0) {
                        const afirmativas = examples.slice(0, 2);
                        const interrogativas = examples.filter((_, i) => i >= 2);
                        if (afirmativas.length > 0) {
                            examplesHTML +=
                                '<div class="section-title">📖 Frases de exemplo</div>';
                            afirmativas.forEach(([jp, trad]) => {
                                examplesHTML += `
                            <div class="example-set">
                                <div class="jp">${jp}</div>
                                <div class="translation">${trad}</div>
                            </div>`;
                            });
                        }
                        if (interrogativas.length > 0) {
                            examplesHTML +=
                                '<div class="section-title">❓ Perguntas com esta estrutura</div>';
                            interrogativas.forEach(([jp, trad]) => {
                                examplesHTML += `
                            <div class="example-set q">
                                <div class="jp">${jp}</div>
                                <div class="translation">${trad}</div>
                            </div>`;
                            });
                        }
                    }
                    return `
                <div class="word-card ${cardClass}" data-index="${rank}">
                    <div class="word-header" onclick="this.parentElement.classList.toggle('open')">
                        <span class="rank">#${rank}</span>
                        <span class="kanji">${kanji}</span>
                        <span class="kana">${kana}</span>
                        <span class="meaning">${meaning}</span>
                        <span class="tag ${tagClass}">${tagText}</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="word-body">
                        ${examplesHTML}
                        ${hasDetail ? `<div class="line-explanation">${explanation}</div>` : ''}
                    </div>
                </div>`;
                }).join('');

                loadMoreArea.style.display = displayCount >= filteredVocab.length ? 'none' : 'block';
                noResults.style.display = filteredVocab.length === 0 ? 'block' : 'none';
                wordList.style.display = filteredVocab.length === 0 ? 'none' : 'flex';
            }

            function updateStats() {
                visibleCount.textContent = `${filteredVocab.length} itens`;
                const labels = { all: 'Todos', n5: 'N5', n4: 'N4', n3: 'N3', particle: 'Partículas', grammar: 'Gramática',
                    verb: 'Verbos', conversation: 'Conversação' };
                filterLabel.textContent = labels[currentFilter] || currentFilter;
            }

            searchInput.addEventListener('input', applyFilter);
            loadMoreBtn.addEventListener('click', () => {
                displayCount += 30;
                if (displayCount > filteredVocab.length) displayCount = filteredVocab.length;
                renderWords();
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-level');
                    applyFilter();
                });
            });

            applyFilter();
        })();
    </script>
</body>
</html>
