<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japonês Essencial N5-N3 — Frequência 500% · Frases e Gramática</title>
    <style>
        :root {
            --bg: #060610;
            --surface: #0e0e1e;
            --surface2: #161630;
            --text: #e8e8f4;
            --text2: #a0a0b8;
            --accent: #d32f2f;
            --accent2: #f44336;
            --gold: #e6b800;
            --blue: #5c9cef;
            --green: #4caf84;
            --purple: #9c7cec;
            --border: #222240;
            --radius: 10px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6, 6, 16, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 8px 14px;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .logo {
            font-weight: 900;
            font-size: 1rem;
            color: #fff;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }
        .logo span {
            color: var(--accent2);
        }
        .search-box {
            flex: 1;
            min-width: 160px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.08);
        }
        .search-box input::placeholder {
            color: #555;
        }
        .stats {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: var(--text2);
        }
        .stats span {
            background: var(--surface2);
            padding: 3px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 14px;
        }
        .controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .filter-btn {
            padding: 5px 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text2);
            cursor: pointer;
            font-size: 0.68rem;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover {
            border-color: #555;
            color: #fff;
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .word-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: 0.2s;
        }
        .word-card:hover {
            border-color: #444;
        }
        .word-card.grammar-card {
            border-left: 3px solid #8e44ad;
        }
        .word-card.particle-card {
            border-left: 3px solid var(--gold);
        }
        .word-card.verb-card {
            border-left: 3px solid var(--accent2);
        }
        .word-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            cursor: pointer;
            user-select: none;
            flex-wrap: wrap;
        }
        .word-header .rank {
            font-size: 0.65rem;
            color: #555;
            min-width: 26px;
            font-weight: 700;
            text-align: right;
        }
        .word-header .kanji {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            min-width: 50px;
        }
        .word-header .kana {
            font-size: 0.75rem;
            color: var(--text2);
            min-width: 60px;
        }
        .word-header .meaning {
            font-size: 0.8rem;
            color: #ccc;
            flex: 1;
            min-width: 90px;
        }
        .word-header .arrow {
            font-size: 0.6rem;
            color: #444;
            transition: transform 0.3s;
        }
        .word-card.open .word-header .arrow {
            transform: rotate(180deg);
        }
        .word-body {
            display: none;
            padding: 0 12px 12px;
            border-top: 1px solid var(--border);
            animation: slideDown 0.3s ease;
        }
        .word-card.open .word-body {
            display: block;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .example-set {
            background: var(--surface2);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
            border-left: 3px solid var(--blue);
        }
        .example-set .jp {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 3px;
            line-height: 1.7;
        }
        .example-set .romaji {
            font-size: 0.7rem;
            color: #777;
            font-style: italic;
            margin-bottom: 2px;
        }
        .example-set .translation {
            font-size: 0.78rem;
            color: #bbb;
            margin-bottom: 2px;
        }
        .example-set.q {
            border-left-color: var(--accent2);
        }
        .example-set.q .jp {
            color: #ffaaaa;
        }
        .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 8px 0 4px;
        }
        .line-explanation {
            font-size: 0.74rem;
            color: #999;
            line-height: 1.7;
            padding-left: 8px;
            border-left: 2px solid #2a2a40;
        }
        .line-explanation strong {
            color: var(--accent2);
        }
        .line-explanation em {
            color: var(--gold);
            font-style: normal;
        }
        .tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 0.58rem;
            font-weight: 700;
            margin-right: 2px;
        }
        .tag-n5 {
            background: #1a3a1a;
            color: #4caf50;
        }
        .tag-n4 {
            background: #1a2a3a;
            color: #64b5f6;
        }
        .tag-n3 {
            background: #3a2a0a;
            color: #ffb74d;
        }
        .tag-grammar {
            background: #2a0a3a;
            color: #d7bde2;
        }
        .tag-particle {
            background: #3a2a00;
            color: #ffd54f;
        }
        .tag-verb {
            background: #3a0a0a;
            color: #ef5350;
        }
        .no-results {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 1rem;
            display: none;
        }
        .load-more {
            text-align: center;
            margin: 14px 0;
        }
        .load-more button {
            padding: 9px 20px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .load-more button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }
        @media (max-width: 600px) {
            .word-header {
                gap: 5px;
                padding: 8px 10px;
            }
            .word-header .kanji {
                font-size: 0.95rem;
                min-width: 38px;
            }
            .word-header .kana {
                font-size: 0.68rem;
                min-width: 45px;
            }
            .word-header .meaning {
                font-size: 0.72rem;
            }
            .example-set .jp {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-inner">
            <div class="logo">日本語 <span>500%</span> · N5→N3</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar palavra, kanji, gramática, português...">
            </div>
            <div class="stats">
                <span id="visibleCount">~600 itens</span>
                <span id="filterLabel">Todos</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="controls" id="filterControls">
            <button class="filter-btn active" data-level="all">📚 Todos</button>
            <button class="filter-btn" data-level="n5">🟢 N5</button>
            <button class="filter-btn" data-level="n4">🔵 N4</button>
            <button class="filter-btn" data-level="n3">🟠 N3</button>
            <button class="filter-btn" data-level="particle">📌 Partículas</button>
            <button class="filter-btn" data-level="grammar">🧩 Gramática</button>
            <button class="filter-btn" data-level="verb">⚡ Verbos</button>
            <button class="filter-btn" data-level="conversation">💬 Conversação</button>
        </div>
        <div class="word-list" id="wordList"></div>
        <div class="load-more" id="loadMoreArea">
            <button id="loadMoreBtn">Mostrar mais 30 ▼</button>
        </div>
        <div class="no-results" id="noResults">🔍 Nenhum item encontrado. Tente outro termo.</div>
    </div>

    <script>
        (function() {
            // ========== BANCO DE DADOS EXPANDIDO: Múltiplas frases + perguntas por entrada ==========
            // Estrutura: [rank, kanji, kana, significado, nivel, tipo,
            //   [[frase1, trad1], [frase2, trad2], [pergunta1, tradP1], ...],
            //   explicacao_detalhada]

            const data = [
                // ==================== PARTÍCULAS ESSENCIAIS ====================
                [1, "は", "は", "partícula de tópico (wa)", "n5", "particle", [
                        ["私は学生です。", "Eu sou estudante."],
                        ["日本語は面白いです。", "Japonês é interessante."],
                        ["今日は何曜日ですか？", "Que dia da semana é hoje?"],
                        ["あなたは日本人ですか？", "Você é japonês(a)?"],
                        ["これは誰のペンですか？", "De quem é esta caneta?"]
                    ],
                    "<strong>は</strong> (lê-se <em>wa</em>) marca o <strong>tópico</strong> da frase — aquilo sobre o qual se fala. Tudo depois do <em>は</em> é informação sobre esse tópico. Nas perguntas, o <em>は</em> continua marcando o assunto principal."
                ],
                [2, "が", "が", "partícula de sujeito / mas", "n5", "particle", [
                        ["雨が降っています。", "Está chovendo."],
                        ["誰が来ますか？", "Quem vem?"],
                        ["猫が好きですが、犬は嫌いです。", "Gosto de gatos, mas não gosto de cachorros."],
                        ["何が食べたいですか？", "O que você quer comer?"],
                        ["お金がありますか？", "Você tem dinheiro?"]
                    ],
                    "<strong>が</strong> marca o <strong>sujeito</strong> gramatical — quem realiza a ação ou estado. Também funciona como conjunção 'mas' no meio da frase. Com verbos de existência (<em>ある/いる</em>) e desejo (<em>〜たい</em>), usa-se <em>が</em> para o objeto."
                ],
                [3, "を", "を", "partícula de objeto direto", "n5", "particle", [
                        ["毎朝パンを食べます。", "Como pão toda manhã."],
                        ["日本語を勉強しています。", "Estou estudando japonês."],
                        ["何をしていますか？", "O que você está fazendo?"],
                        ["この本を読んだことがありますか？", "Você já leu este livro?"],
                        ["窓を開けてもいいですか？", "Posso abrir a janela?"]
                    ],
                    "<strong>を</strong> marca o <strong>objeto direto</strong> do verbo — a coisa que recebe a ação. Com verbos de movimento como <em>出る、歩く、渡る</em>, indica o local percorrido ou de saída."
                ],
                [4, "に", "に", "localização / direção / tempo / alvo", "n5", "particle", [
                        ["7時に起きます。", "Acordo às 7h."],
                        ["学校に行きます。", "Vou à escola."],
                        ["机の上に本があります。", "Há um livro em cima da mesa."],
                        ["何時に寝ますか？", "A que horas você dorme?"],
                        ["友達にプレゼントをあげました。", "Dei um presente ao amigo."]
                    ],
                    "<strong>に</strong> tem múltiplos usos: 1) <strong>ponto temporal</strong> específico (às 7h); 2) <strong>destino</strong> com verbos de movimento; 3) <strong>local de existência</strong> com <em>ある/いる</em>; 4) <strong>alvo/recipiente</strong> com verbos como <em>あげる、会う、教える</em>."
                ],
                [5, "で", "で", "local de ação / meio / causa", "n5", "particle", [
                        ["図書館で勉強します。", "Estudo na biblioteca."],
                        ["電車で会社に行きます。", "Vou de trem para a empresa."],
                        ["どこで食べましょうか？", "Onde vamos comer?"],
                        ["何で来ましたか？", "Como você veio?"],
                        ["病気で学校を休みました。", "Faltei à escola por doença."]
                    ],
                    "<strong>で</strong> indica: 1) <strong>local da ação</strong> (onde algo acontece); 2) <strong>meio/instrumento</strong> (como se faz); 3) <strong>causa/motivo</strong> (por que algo ocorre)."
                ],
                [6, "と", "と", "e / com / citação", "n5", "particle", [
                        ["パンと卵を食べます。", "Como pão e ovo."],
                        ["友達と映画を見ました。", "Assisti a um filme com um amigo."],
                        ["彼は「行く」と言いました。", "Ele disse 'vou'."],
                        ["誰と来ましたか？", "Com quem você veio?"],
                        ["これとそれ、どちらがいいですか？", "Qual você prefere, este ou esse?"]
                    ],
                    "<strong>と</strong> conecta: 1) <strong>substantivos</strong> (lista exaustiva); 2) <strong>companhia</strong>; 3) <strong>citação</strong> antes de verbos como <em>言う、思う、書く</em>."
                ],
                [7, "の", "の", "possessivo / nominalizador", "n5", "particle", [
                        ["これは私の本です。", "Este é meu livro."],
                        ["料理を作るのが好きです。", "Gosto de cozinhar."],
                        ["これは誰のですか？", "De quem é isto?"],
                        ["何をするのが趣味ですか？", "Qual é o seu hobby?"],
                        ["赤いのが欲しいです。", "Quero o vermelho."]
                    ],
                    "<strong>の</strong> funciona como: 1) <strong>possessivo</strong> ('de'); 2) <strong>nominalizador</strong> — transforma verbo/adjetivo em substantivo; 3) <strong>pronome possessivo</strong> (substitui o substantivo)."
                ],
                [8, "も", "も", "também / inclusive / nem", "n5", "particle", [
                        ["私も行きます。", "Eu também vou."],
                        ["何もありません。", "Não há nada."],
                        ["誰も来ませんでした。", "Ninguém veio."],
                        ["これもそれも好きですか？", "Você gosta tanto deste quanto desse?"],
                        ["一度も日本に行ったことがありません。", "Nunca fui ao Japão."]
                    ],
                    "<strong>も</strong> substitui <em>は/が/を</em> para 'também'. Com palavras interrogativas + verbo negativo, significa 'nada/ninguém/nunca' (negação total)."
                ],
                [9, "から", "から", "de / desde / porque", "n5", "particle", [
                        ["ブラジルから来ました。", "Vim do Brasil."],
                        ["9時から働きます。", "Trabalho desde as 9h."],
                        ["暑いから窓を開けます。", "Como está quente, vou abrir a janela."],
                        ["どこから来ましたか？", "De onde você veio?"],
                        ["なぜ日本語を勉強しているのですか？—好きだからです。", "Por que estuda japonês? — Porque gosto."]
                    ],
                    "<strong>から</strong> marca: 1) <strong>origem/ponto de partida</strong>; 2) <strong>causa/razão</strong> (após frase informal); 3) <strong>início temporal</strong> (desde)."
                ],
                [10, "まで", "まで", "até (limite)", "n5", "particle", [
                        ["駅まで歩いて10分です。", "São 10 minutos a pé até a estação."],
                        ["5時まで待ちます。", "Espero até as 5h."],
                        ["何時まで働きますか？", "Até que horas você trabalha?"],
                        ["ここから東京までどのくらいですか？", "Quanto tempo leva daqui até Tóquio?"],
                        ["締め切りは明日までです。", "O prazo é até amanhã."]
                    ],
                    "<strong>まで</strong> indica o <strong>limite final</strong> de tempo, espaço ou quantidade. Frequentemente usado com <em>から</em> para 'de ~ até'."
                ],

                // ==================== GRAMÁTICA ESSENCIAL ====================
                [11, "〜ている", "〜ている", "ação contínua / estado resultante", "n5", "grammar", [
                        ["今、日本語を勉強しています。", "Agora estou estudando japonês."],
                        ["姉は結婚しています。", "Minha irmã mais velha está casada."],
                        ["何をしていますか？", "O que você está fazendo?"],
                        ["もう食べましたか？—はい、もう食べています。", "Já comeu? — Sim, já comi (estou no estado de ter comido)."],
                        ["この映画を知っていますか？", "Você conhece este filme?"]
                    ],
                    "<strong>〜ている</strong> tem dois sentidos principais: 1) <strong>ação em progresso</strong> ('estar fazendo'); 2) <strong>estado resultante</strong> ('estar casado', 'ter comido', 'saber/conhecer'). A diferença depende do verbo."
                ],
                [12, "〜たい", "〜たい", "querer fazer", "n5", "grammar", [
                        ["日本に行きたいです。", "Quero ir ao Japão."],
                        ["何が食べたいですか？", "O que você quer comer?"],
                        ["映画を見たくないですか？", "Você não quer ver um filme?"],
                        ["子供の頃、医者になりたかったです。", "Quando criança, queria ser médico."],
                        ["何をしたいですか？", "O que você quer fazer?"]
                    ],
                    "<strong>〜たい</strong> expressa <strong>desejo</strong> de fazer algo. Conjuga-se como adjetivo-<em>i</em>: <em>たくない</em> (não quero), <em>たかった</em> (queria). O objeto pode usar <em>が</em> em vez de <em>を</em>."
                ],
                [13, "〜ない", "〜ない", "negação informal", "n5", "grammar", [
                        ["今日は働きません。", "Hoje não trabalho."],
                        ["まだ食べていない。", "Ainda não comi."],
                        ["なぜ来なかったのですか？", "Por que você não veio?"],
                        ["分からないことがありますか？", "Há algo que você não entende?"],
                        ["全然面白くない。", "Não é nada interessante."]
                    ],
                    "<strong>〜ない</strong> é a forma negativa informal. Grupo 1: troca <em>u</em> por <em>a</em> + <em>ない</em> (書く→書かない). Grupo 2: troca <em>る</em> por <em>ない</em> (食べる→食べない). Forma polida: <em>〜ません</em>."
                ],
                [14, "〜た", "〜た", "passado informal", "n5", "grammar", [
                        ["昨日映画を見た。", "Ontem vi um filme."],
                        ["もう宿題をやった？", "Já fez a lição de casa?"],
                        ["何を食べましたか？", "O que você comeu?"],
                        ["いつ日本に行きましたか？", "Quando você foi ao Japão?"],
                        ["面白かったです。", "Foi interessante."]
                    ],
                    "<strong>〜た</strong> marca o passado informal. Grupo 1: variações conforme final (書く→書いた, 読む→読んだ, 話す→話した). Grupo 2: troca <em>る</em> por <em>た</em>. Adjetivos-<em>i</em>: troca <em>い</em> por <em>かった</em>."
                ],
                [15, "〜てください", "〜てください", "por favor faça", "n5", "grammar", [
                        ["ここに名前を書いてください。", "Por favor, escreva seu nome aqui."],
                        ["ちょっと待ってください。", "Espere um momento, por favor."],
                        ["もう一度言ってくださいませんか？", "Poderia dizer mais uma vez?"],
                        ["窓を閉めてください。", "Feche a janela, por favor."],
                        ["教えてください。", "Me ensine, por favor."]
                    ],
                    "<strong>〜てください</strong> é um pedido educado. Forma: verbo na forma <em>te</em> + <em>ください</em>. Para ser ainda mais polido: <em>〜てくださいませんか</em>."
                ],
                [16, "〜てもいい", "〜てもいい", "pode fazer / permitido", "n5", "grammar", [
                        ["写真を撮ってもいいですか？", "Posso tirar foto?"],
                        ["ここに座ってもいいですよ。", "Pode sentar aqui."],
                        ["何を聞いてもいいですか？", "O que posso perguntar?"],
                        ["帰ってもいいですか？", "Posso ir embora?"],
                        ["タバコを吸ってもいいですか？", "Posso fumar?"]
                    ],
                    "<strong>〜てもいい</strong> pergunta ou concede permissão. Literalmente: 'mesmo que faça, está bem'. Forma negativa: <em>〜てはいけない</em> (não pode/proibido)."
                ],
                [17, "〜たことがある", "〜たことがある", "já fez / tem experiência de", "n4", "grammar", [
                        ["日本に行ったことがありますか？", "Você já foi ao Japão?"],
                        ["寿司を食べたことがあります。", "Já comi sushi."],
                        ["富士山に登ったことがありますか？", "Já escalou o Monte Fuji?"],
                        ["一度も見たことがありません。", "Nunca vi."],
                        ["どんな国に行ったことがありますか？", "Para quais países você já foi?"]
                    ],
                    "<strong>〜たことがある</strong> expressa <strong>experiência de vida</strong>. Literalmente: 'existe o fato de ter feito'. Negativa: <em>〜たことがない</em>. A forma polida é <em>〜たことがあります</em>."
                ],
                [18, "〜つもり", "〜つもり", "pretensão / plano / intenção", "n4", "grammar", [

                    ["秋の紅葉が綺麗ですね。", "As folhas de outono estão lindas."]
                ]],
                ["冬", "ふゆ", "inverno", "n5", "noun", [
                    ["冬は雪が降ります。", "No inverno neva."],
                    ["今年の冬は特に寒い。", "Este inverno está especialmente frio."],
                    ["冬休みに温泉に行きたい。", "Nas férias de inverno quero ir a águas termais."]
                ]],
            ];

            // Construir array completo
            const fullData = [...data];
            let rank = data.length + 1;
            moreData.forEach(w => {
                fullData.push([rank, w[0], w[1], w[2], w[3], w[4], w[5], w[6] || ""]);
                rank++;
            });

            // ========== RENDERIZAÇÃO ==========
            const wordList = document.getElementById('wordList');
            const searchInput = document.getElementById('searchInput');
            const visibleCount = document.getElementById('visibleCount');
            const filterLabel = document.getElementById('filterLabel');
            const noResults = document.getElementById('noResults');
            const loadMoreArea = document.getElementById('loadMoreArea');
            const loadMoreBtn = document.getElementById('loadMoreBtn');

            let currentFilter = 'all';
            let displayCount = 30;
            let filteredVocab = [...fullData];

            function applyFilter() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                filteredVocab = fullData.filter(item => {
                    const [rank, kanji, kana, meaning, level, type, examples, explanation] = item;
                    const allText = [kanji, kana, meaning, (explanation || '')].join(' ').toLowerCase();
                    const matchesSearch = !searchTerm || allText.includes(searchTerm) || (examples &&
                        examples.some(e => e[0].includes(searchTerm) || e[1].toLowerCase().includes(
                            searchTerm)));
                    const matchesFilter = currentFilter === 'all' || level === currentFilter || type ===
                        currentFilter;
                    return matchesSearch && matchesFilter;
                });
                displayCount = 30;
                renderWords();
                updateStats();
            }

            function renderWords() {
                const slice = filteredVocab.slice(0, displayCount);
                wordList.innerHTML = slice.map(item => {
                    const [rank, kanji, kana, meaning, level, type, examples, explanation] = item;
                    const hasDetail = explanation && explanation.length > 20;
                    const cardClass = type === 'grammar' ? 'grammar-card' : (type === 'particle' ?
                        'particle-card' : (type === 'verb' ? 'verb-card' : ''));
                    const tagClass = type === 'grammar' ? 'tag-grammar' : (type === 'particle' ? 'tag-particle' :
                        (type === 'verb' ? 'tag-verb' : `tag-${level}`));
                    const tagText = type === 'grammar' ? 'GRAM' : (type === 'particle' ? 'PART' : (type ===
                        'verb' ? 'VERB' : level.toUpperCase()));
                    // Renderizar frases de exemplo
                    let examplesHTML = '';
                    if (examples && examples.length > 0) {
                        const afirmativas = examples.slice(0, 2); // primeiras 2 são afirmativas
                        const interrogativas = examples.filter((_, i) => i >= 2); // restantes são perguntas
                        if (afirmativas.length > 0) {
                            examplesHTML +=
                                '<div class="section-title">📖 Frases de exemplo</div>';
                            afirmativas.forEach(([jp, trad]) => {
                                examplesHTML += `
                            <div class="example-set">
                                <div class="jp">${jp}</div>
                                <div class="translation">${trad}</div>
                            </div>`;
                            });
                        }
                        if (interrogativas.length > 0) {
                            examplesHTML +=
                                '<div class="section-title"> ++ </div>';
                            interrogativas.forEach(([jp, trad]) => {
                                examplesHTML += `
                            <div class="example-set q">
                                <div class="jp">${jp}</div>
                                <div class="translation">${trad}</div>
                            </div>`;
                            });
                        }
                    }
                    return `
                <div class="word-card ${cardClass}" data-index="${rank}">
                    <div class="word-header" onclick="this.parentElement.classList.toggle('open')">
                        <span class="rank">#${rank}</span>
                        <span class="kanji">${kanji}</span>
                        <span class="kana">${kana}</span>
                        <span class="meaning">${meaning}</span>
                        <span class="tag ${tagClass}">${tagText}</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="word-body">
                        ${examplesHTML}
                        ${hasDetail ? `<div class="line-explanation">${explanation}</div>` : ''}
                    </div>
                </div>`;
                }).join('');

                loadMoreArea.style.display = displayCount >= filteredVocab.length ? 'none' : 'block';
                noResults.style.display = filteredVocab.length === 0 ? 'block' : 'none';
                wordList.style.display = filteredVocab.length === 0 ? 'none' : 'flex';
            }

            function updateStats() {
                visibleCount.textContent = `${filteredVocab.length} itens`;
                const labels = { all: 'Todos', n5: 'N5', n4: 'N4', n3: 'N3', particle: 'Partículas', grammar: 'Gramática',
                    verb: 'Verbos', conversation: 'Conversação' };
                filterLabel.textContent = labels[currentFilter] || currentFilter;
            }

            searchInput.addEventListener('input', applyFilter);
            loadMoreBtn.addEventListener('click', () => {
                displayCount += 30;
                if (displayCount > filteredVocab.length) displayCount = filteredVocab.length;
                renderWords();
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-level');
                    applyFilter();
                });
            });

            applyFilter();
        })();
    </script>
        </script>

                    exp: "<strong>「エクスペリアームス」と叫び</strong> = 'gritou \"Expelliarmus\"'. <em>叫ぶ</em>=gritar.<br><strong>「アバダケダブラ」と叫びました</strong> = 'gritou \"Avada Kedavra\"'."
                },
                {
                    jp: "しかし、杖の主はハリーだったので、死の呪文は再びはね返りました。",
                    trad: "No entanto, como o mestre da varinha era Harry, o feitiço da morte ricocheteou novamente.",
                    exp: "<strong>杖の主はハリーだったので</strong> = 'como o mestre da varinha era Harry'. <em>主</em>=mestre/dono, <em>〜なので</em>=porque (explicativo).<br><strong>再びはね返りました</strong> = 'ricocheteou novamente'. <em>再び</em>=novamente."
                },
                {
                    jp: "ヴォルデモートは自分の呪文で倒れ、ついに死にました。",
                    trad: "Voldemort caiu com seu próprio feitiço e finalmente morreu.",
                    exp: "<strong>自分の呪文で倒れ</strong> = 'caiu com o próprio feitiço'. <em>倒れる</em>=cair/tombar.<br><strong>ついに死にました</strong> = 'finalmente morreu'. <em>ついに</em>=finalmente."
                },
                {
                    jp: "こうして、長い戦いが終わりました。",
                    trad: "Assim, a longa batalha terminou.",
                    exp: "<strong>こうして</strong> = 'assim/desta forma'.<br><strong>長い戦いが終わりました</strong> = 'a longa batalha terminou'. <em>戦い</em>=batalha, <em>終わる</em>=terminar."
                },
                {
                    jp: "ハリーは生き残り、魔法界に平和が戻りました。",
                    trad: "Harry sobreviveu e a paz voltou ao mundo bruxo.",
                    exp: "<strong>生き残り</strong> = 'sobreviveu e...'. <em>生き残る</em>=sobreviver.<br><strong>平和が戻りました</strong> = 'a paz voltou'. <em>平和</em>=paz, <em>戻る</em>=voltar."
                },
                {
                    jp: "後年、ハリーはジニーと結婚し、三人の子供をもうけました。",
                    trad: "Anos depois, Harry se casou com Gina e tiveram três filhos.",
                    exp: "<strong>後年</strong> = 'anos depois'.<br><strong>ジニーと結婚し</strong> = 'casou com Gina'.<br><strong>三人の子供をもうけました</strong> = 'tiveram três filhos'. <em>もうける</em>=ter filhos (formal)."
                },
                {
                    jp: "ロンとハーマイオニーも結婚して、幸せな家庭を築きました。",
                    trad: "Ron e Hermione também se casaram e construíram famílias felizes.",
                    exp: "<strong>結婚して</strong> = 'casaram-se e...'.<br><strong>幸せな家庭を築きました</strong> = 'construíram um lar feliz'. <em>築く</em>=construir/estabelecer."
                },
                {
                    jp: "ハリーの額の傷跡はもう痛むことはありませんでした。",
                    trad: "A cicatriz na testa de Harry nunca mais doeu.",
                    exp: "<strong>額の傷跡は</strong> = 'a cicatriz da testa (tópico)'.<br><strong>もう痛むことはありませんでした</strong> = 'nunca mais doeu'. <em>痛む</em>=doer, <em>〜ことはない</em>=não há ocasião de / nunca acontece."
                },
                {
                    jp: "全てがうまくいきました。",
                    trad: "Tudo terminou bem.",
                    exp: "<strong>全てが</strong> = 'tudo (sujeito)'.<br><strong>うまくいきました</strong> = 'foi bem/deu certo'. <em>うまくいく</em>=dar certo/ir bem."
                },
                {
                    jp: "これは愛と勇気と友情の物語です。",
                    trad: "Esta é uma história de amor, coragem e amizade.",
                    exp: "<strong>愛と勇気と友情の物語です</strong> = 'é uma história de amor, coragem e amizade'. <em>勇気</em>=coragem, <em>友情</em>=amizade."
                },
            ];

            const listEl = document.getElementById('harryPotterList');
            if (listEl) {
                listEl.innerHTML = harryPotterText.map((item, i) => `
                <div class="word-card" style="background: #0e0e1e; border: 1px solid #222240; border-radius: 10px; overflow: hidden;">
                    <div class="word-header" onclick="this.parentElement.classList.toggle('open')" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; flex-wrap: wrap;">
                        <span class="rank" style="font-size:0.65rem;color:#555;min-width:24px;font-weight:700;text-align:right;">${i+1}</span>
                        <span class="kanji" style="font-size:0.95rem;font-weight:700;color:#fff;flex:1;min-width:200px;">${item.jp}</span>
                        <span class="arrow" style="font-size:0.6rem;color:#444;transition:transform 0.3s;">▼</span>
                    </div>
                    <div class="word-body" style="display:none;padding:0 14px 14px;border-top:1px solid #222240;">
                        <div class="example-block" style="background:#161630;border-radius:8px;padding:10px;margin:8px 0;border-left:3px solid #ffb300;">
                            <div class="translation" style="font-size:0.82rem;color:#bbb;margin-bottom:6px;">${item.trad}</div>
                        </div>
                        <div class="line-explanation" style="font-size:0.74rem;color:#999;line-height:1.7;padding-left:8px;border-left:2px solid #2a2a40;">${item.exp}</div>
                    </div>
                </div>`).join('');

                // Adicionar listener para expandir/recolher
                listEl.querySelectorAll('.word-header').forEach(header => {
                    header.addEventListener('click', function() {
                        const card = this.parentElement;
                        card.classList.toggle('open');
                        const body = card.querySelector('.word-body');
                        const arrow = card.querySelector('.arrow');
                        if (card.classList.contains('open')) {
                            body.style.display = 'block';
                            arrow.style.transform = 'rotate(180deg)';
                        } else {
                            body.style.display = 'none';
                            arrow.style.transform = 'rotate(0deg)';
                        }
                    });
                });
            }
        })();
    </script>
</body>
</html>
