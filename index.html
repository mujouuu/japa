<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japonês Essencial N5-N3 — Frequência 500% · Frases e Gramática + Harry Potter</title>
    <style>
        :root {
            --bg: #060610;
            --surface: #0e0e1e;
            --surface2: #161630;
            --text: #e8e8f4;
            --text2: #a0a0b8;
            --accent: #d32f2f;
            --accent2: #f44336;
            --gold: #e6b800;
            --blue: #5c9cef;
            --green: #4caf84;
            --purple: #9c7cec;
            --border: #222240;
            --radius: 10px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6, 6, 16, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 8px 14px;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .logo {
            font-weight: 900;
            font-size: 1rem;
            color: #fff;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }
        .logo span {
            color: var(--accent2);
        }
        .search-box {
            flex: 1;
            min-width: 160px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #fff;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.08);
        }
        .search-box input::placeholder {
            color: #555;
        }
        .stats {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: var(--text2);
        }
        .stats span {
            background: var(--surface2);
            padding: 3px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 14px;
        }
        .controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .filter-btn {
            padding: 5px 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text2);
            cursor: pointer;
            font-size: 0.68rem;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover {
            border-color: #555;
            color: #fff;
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .word-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: 0.2s;
        }
        .word-card:hover {
            border-color: #444;
        }
        .word-card.grammar-card {
            border-left: 3px solid #8e44ad;
        }
        .word-card.particle-card {
            border-left: 3px solid var(--gold);
        }
        .word-card.verb-card {
            border-left: 3px solid var(--accent2);
        }
        .word-card.hp-card {
            border-left: 3px solid #ffb300;
            background: #0a0a18;
        }
        .word-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            cursor: pointer;
            user-select: none;
            flex-wrap: wrap;
        }
        .word-header .rank {
            font-size: 0.65rem;
            color: #555;
            min-width: 26px;
            font-weight: 700;
            text-align: right;
        }
        .word-header .kanji {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            flex: 1;
            min-width: 50px;
        }
        .word-header .kana {
            font-size: 0.75rem;
            color: var(--text2);
            min-width: 60px;
        }
        .word-header .meaning {
            font-size: 0.8rem;
            color: #ccc;
            flex: 2;
            min-width: 90px;
        }
        .word-header .arrow {
            font-size: 0.6rem;
            color: #444;
            transition: transform 0.3s;
        }
        .word-card.open .word-header .arrow {
            transform: rotate(180deg);
        }
        .word-body {
            display: none;
            padding: 0 12px 12px;
            border-top: 1px solid var(--border);
            animation: slideDown 0.3s ease;
        }
        .word-card.open .word-body {
            display: block;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .example-set {
            background: var(--surface2);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
            border-left: 3px solid var(--blue);
        }
        .example-set .jp {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 3px;
            line-height: 1.7;
        }
        .example-set .translation {
            font-size: 0.78rem;
            color: #bbb;
            margin-bottom: 2px;
        }
        .example-set.q {
            border-left-color: var(--accent2);
        }
        .example-set.q .jp {
            color: #ffaaaa;
        }
        .section-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 8px 0 4px;
        }
        .line-explanation {
            font-size: 0.74rem;
            color: #999;
            line-height: 1.7;
            padding-left: 8px;
            border-left: 2px solid #2a2a40;
        }
        .line-explanation strong {
            color: var(--accent2);
        }
        .line-explanation em {
            color: var(--gold);
            font-style: normal;
        }
        .tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 0.58rem;
            font-weight: 700;
            margin-right: 2px;
        }
        .tag-n5 {
            background: #1a3a1a;
            color: #4caf50;
        }
        .tag-n4 {
            background: #1a2a3a;
            color: #64b5f6;
        }
        .tag-n3 {
            background: #3a2a0a;
            color: #ffb74d;
        }
        .tag-grammar {
            background: #2a0a3a;
            color: #d7bde2;
        }
        .tag-particle {
            background: #3a2a00;
            color: #ffd54f;
        }
        .tag-verb {
            background: #3a0a0a;
            color: #ef5350;
        }
        .tag-hp {
            background: #3a2a00;
            color: #ffb300;
        }
        .no-results {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 1rem;
            display: none;
        }
        .load-more {
            text-align: center;
            margin: 14px 0;
        }
        .load-more button {
            padding: 9px 20px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .load-more button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }
        .divider {
            border: none;
            border-top: 2px solid #333;
            margin: 24px 0;
        }
        @media (max-width: 600px) {
            .word-header {
                gap: 5px;
                padding: 8px 10px;
            }
            .word-header .kanji {
                font-size: 0.85rem;
                min-width: 38px;
            }
            .word-header .kana {
                font-size: 0.68rem;
                min-width: 45px;
            }
            .word-header .meaning {
                font-size: 0.72rem;
            }
            .example-set .jp {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-inner">
            <div class="logo">日本語 <span>500%</span> · N5→N3</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar palavra, kanji, gramática, português...">
            </div>
            <div class="stats">
                <span id="visibleCount">~600 itens</span>
                <span id="filterLabel">Todos</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="controls" id="filterControls">
            <button class="filter-btn active" data-level="all">📚 Todos</button>
            <button class="filter-btn" data-level="n5">🟢 N5</button>
            <button class="filter-btn" data-level="n4">🔵 N4</button>
            <button class="filter-btn" data-level="n3">🟠 N3</button>
            <button class="filter-btn" data-level="particle">📌 Partículas</button>
            <button class="filter-btn" data-level="grammar">🧩 Gramática</button>
            <button class="filter-btn" data-level="verb">⚡ Verbos</button>
            <button class="filter-btn" data-level="conversation">💬 Conversação</button>
        </div>
        <div class="word-list" id="wordList"></div>
        <div class="load-more" id="loadMoreArea">
            <button id="loadMoreBtn">Mostrar mais 30 ▼</button>
        </div>
        <div class="no-results" id="noResults">🔍 Nenhum item encontrado. Tente outro termo.</div>

        <!-- ==================== DIVISOR ==================== -->
        <hr class="divider">

        <!-- ==================== SEÇÃO HARRY POTTER ==================== -->
        <div style="margin-top: 10px;">
            <span class="section-title" style="background:rgba(255,179,0,0.12);color:#ffb300;border:1px solid rgba(255,179,0,0.2);display:inline-block;padding:5px 12px;border-radius:20px;font-size:0.73rem;font-weight:700;letter-spacing:0.4px;margin-bottom:10px;">📖 LEITURA GUIADA</span>
            <h2 style="font-family:'Segoe UI',sans-serif;font-size:clamp(1.4rem,4vw,1.8rem);font-weight:800;letter-spacing:-0.8px;margin-bottom:8px;color:#fff;">Harry Potter — História em Japonês Falado</h2>
            <p style="color:#a0a0b8;margin-bottom:20px;font-size:0.9rem;">Vocabulário frequente (N5–N3) · Explicação linha a linha · Clique em cada frase</p>
            <div class="word-list" id="harryPotterList"></div>
        </div>
    </div>

    <script>
        (function() {
            // ========== BANCO DE DADOS PRINCIPAL ==========
            // Estrutura: [rank, kanji, kana, significado, nivel, tipo,
            //   [[frase1, trad1], [frase2, trad2], [pergunta1, tradP1], ...],
            //   explicacao_detalhada]

            const data = [
                // ==================== PARTÍCULAS ====================
                [1, "は", "は", "partícula de tópico (wa)", "n5", "particle", [
                        ["私は学生です。", "Eu sou estudante."],
                        ["日本語は面白いです。", "Japonês é interessante."],
                        ["今日は何曜日ですか？", "Que dia da semana é hoje?"],
                        ["あなたは日本人ですか？", "Você é japonês(a)?"],
                        ["これは誰のペンですか？", "De quem é esta caneta?"]
                    ],
                    "<strong>は</strong> (lê-se <em>wa</em>) marca o <strong>tópico</strong> da frase — aquilo sobre o qual se fala. Tudo depois do <em>は</em> é informação sobre esse tópico. Nas perguntas, o <em>は</em> continua marcando o assunto principal."
                ],
                [2, "が", "が", "partícula de sujeito / mas", "n5", "particle", [
                        ["雨が降っています。", "Está chovendo."],
                        ["誰が来ますか？", "Quem vem?"],
                        ["猫が好きですが、犬は嫌いです。", "Gosto de gatos, mas não gosto de cachorros."],
                        ["何が食べたいですか？", "O que você quer comer?"],
                        ["お金がありますか？", "Você tem dinheiro?"]
                    ],
                    "<strong>が</strong> marca o <strong>sujeito</strong> gramatical. Também funciona como conjunção 'mas'. Com verbos de existência (<em>ある/いる</em>) e desejo (<em>〜たい</em>), usa-se <em>が</em> para o objeto."
                ],
                [3, "を", "を", "partícula de objeto direto", "n5", "particle", [
                        ["毎朝パンを食べます。", "Como pão toda manhã."],
                        ["日本語を勉強しています。", "Estou estudando japonês."],
                        ["何をしていますか？", "O que você está fazendo?"],
                        ["この本を読んだことがありますか？", "Você já leu este livro?"],
                        ["窓を開けてもいいですか？", "Posso abrir a janela?"]
                    ],
                    "<strong>を</strong> marca o <strong>objeto direto</strong> do verbo. Com verbos de movimento, indica o local percorrido ou de saída."
                ],
                [4, "に", "に", "localização / direção / tempo / alvo", "n5", "particle", [
                        ["7時に起きます。", "Acordo às 7h."],
                        ["学校に行きます。", "Vou à escola."],
                        ["机の上に本があります。", "Há um livro em cima da mesa."],
                        ["何時に寝ますか？", "A que horas você dorme?"],
                        ["友達にプレゼントをあげました。", "Dei um presente ao amigo."]
                    ],
                    "<strong>に</strong> tem múltiplos usos: 1) <strong>ponto temporal</strong>; 2) <strong>destino</strong>; 3) <strong>local de existência</strong>; 4) <strong>alvo/recipiente</strong> com verbos como <em>あげる、会う、教える</em>."
                ],
                [5, "で", "で", "local de ação / meio / causa", "n5", "particle", [
                        ["図書館で勉強します。", "Estudo na biblioteca."],
                        ["電車で会社に行きます。", "Vou de trem para a empresa."],
                        ["どこで食べましょうか？", "Onde vamos comer?"],
                        ["何で来ましたか？", "Como você veio?"],
                        ["病気で学校を休みました。", "Faltei à escola por doença."]
                    ],
                    "<strong>で</strong> indica: 1) <strong>local da ação</strong>; 2) <strong>meio/instrumento</strong>; 3) <strong>causa/motivo</strong>."
                ],
                [6, "と", "と", "e / com / citação", "n5", "particle", [
                        ["パンと卵を食べます。", "Como pão e ovo."],
                        ["友達と映画を見ました。", "Assisti a um filme com um amigo."],
                        ["彼は「行く」と言いました。", "Ele disse 'vou'."],
                        ["誰と来ましたか？", "Com quem você veio?"],
                        ["これとそれ、どちらがいいですか？", "Qual você prefere, este ou esse?"]
                    ],
                    "<strong>と</strong> conecta: 1) <strong>substantivos</strong>; 2) <strong>companhia</strong>; 3) <strong>citação</strong> antes de verbos como <em>言う、思う</em>."
                ],
                [7, "の", "の", "possessivo / nominalizador", "n5", "particle", [
                        ["これは私の本です。", "Este é meu livro."],
                        ["料理を作るのが好きです。", "Gosto de cozinhar."],
                        ["これは誰のですか？", "De quem é isto?"],
                        ["何をするのが趣味ですか？", "Qual é o seu hobby?"],
                        ["赤いのが欲しいです。", "Quero o vermelho."]
                    ],
                    "<strong>の</strong>: 1) <strong>possessivo</strong>; 2) <strong>nominalizador</strong>; 3) <strong>pronome possessivo</strong>."
                ],
                [8, "も", "も", "também / inclusive / nem", "n5", "particle", [
                        ["私も行きます。", "Eu também vou."],
                        ["何もありません。", "Não há nada."],
                        ["誰も来ませんでした。", "Ninguém veio."],
                        ["これもそれも好きですか？", "Gosta tanto deste quanto desse?"],
                        ["一度も日本に行ったことがありません。", "Nunca fui ao Japão."]
                    ],
                    "<strong>も</strong> = 'também'. Com interrogativas + negativo = 'nada/ninguém/nunca'."
                ],
                [9, "から", "から", "de / desde / porque", "n5", "particle", [
                        ["ブラジルから来ました。", "Vim do Brasil."],
                        ["9時から働きます。", "Trabalho desde as 9h."],
                        ["暑いから窓を開けます。", "Como está quente, vou abrir a janela."],
                        ["どこから来ましたか？", "De onde você veio?"],
                        ["なぜ日本語を勉強しているのですか？—好きだからです。", "Por que estuda japonês? — Porque gosto."]
                    ],
                    "<strong>から</strong>: 1) <strong>origem</strong>; 2) <strong>causa</strong>; 3) <strong>início temporal</strong>."
                ],
                [10, "まで", "まで", "até (limite)", "n5", "particle", [
                        ["駅まで歩いて10分です。", "São 10 minutos a pé até a estação."],
                        ["5時まで待ちます。", "Espero até as 5h."],
                        ["何時まで働きますか？", "Até que horas você trabalha?"],
                        ["ここから東京までどのくらいですか？", "Quanto tempo daqui até Tóquio?"],
                        ["締め切りは明日までです。", "O prazo é até amanhã."]
                    ],
                    "<strong>まで</strong> = <strong>limite final</strong> de tempo, espaço ou quantidade."
                ],

                // ==================== GRAMÁTICA ====================
                [11, "〜ている", "〜ている", "ação contínua / estado resultante", "n5", "grammar", [
                        ["今、日本語を勉強しています。", "Agora estou estudando japonês."],
                        ["姉は結婚しています。", "Minha irmã está casada."],
                        ["何をしていますか？", "O que você está fazendo?"],
                        ["もう食べましたか？—はい、もう食べています。", "Já comeu? — Sim, já comi."],
                        ["この映画を知っていますか？", "Você conhece este filme?"]
                    ],
                    "<strong>〜ている</strong>: 1) <strong>ação em progresso</strong>; 2) <strong>estado resultante</strong> ('estar casado', 'saber')."
                ],
                [12, "〜たい", "〜たい", "querer fazer", "n5", "grammar", [
                        ["日本に行きたいです。", "Quero ir ao Japão."],
                        ["何が食べたいですか？", "O que você quer comer?"],
                        ["映画を見たくないですか？", "Não quer ver um filme?"],
                        ["子供の頃、医者になりたかったです。", "Quando criança, queria ser médico."],
                        ["何をしたいですか？", "O que você quer fazer?"]
                    ],
                    "<strong>〜たい</strong> = <strong>desejo</strong>. Conjuga como adjetivo-<em>i</em>. Objeto pode usar <em>が</em>."
                ],
                [13, "〜たことがある", "〜たことがある", "já fez / experiência", "n4", "grammar", [
                        ["日本に行ったことがありますか？", "Você já foi ao Japão?"],
                        ["寿司を食べたことがあります。", "Já comi sushi."],
                        ["富士山に登ったことがありますか？", "Já escalou o Monte Fuji?"],
                        ["一度も見たことがありません。", "Nunca vi."],
                        ["どんな国に行ったことがありますか？", "Para quais países você já foi?"]
                    ],
                    "<strong>〜たことがある</strong> = <strong>experiência de vida</strong>. Negativa: <em>〜たことがない</em>."
                ],
                [14, "〜つもり", "〜つもり", "pretensão / plano", "n4", "grammar", [
                        ["来年日本に留学するつもりです。", "Pretendo estudar no Japão ano que vem."],
                        ["明日何をするつもりですか？", "O que pretende fazer amanhã?"],
                        ["彼女と結婚するつもりですか？", "Pretende se casar com ela?"],
                        ["タバコをやめるつもりです。", "Pretendo parar de fumar."],
                        ["今日は出かけないつもりです。", "Não pretendo sair hoje."]
                    ],
                    "<strong>〜つもり</strong> = <strong>intenção decidida</strong>. Não se usa para eventos fora do controle."
                ],
                [15, "〜と思う", "〜とおもう", "achar que / pensar", "n5", "grammar", [
                        ["この映画は面白いと思います。", "Acho este filme interessante."],
                        ["彼は来ると思いますか？", "Acha que ele vem?"],
                        ["どう思いますか？", "O que você acha?"],
                        ["いいアイデアだと思います。", "Acho uma boa ideia."],
                        ["私は違うと思います。", "Acho diferente / discordo."]
                    ],
                    "<strong>〜と思う</strong> = <strong>opinião</strong>. Frase antes do <em>と</em> na forma informal."
                ],
                [16, "〜になる / 〜にする", "〜になる / 〜にする", "tornar-se / decidir", "n5", "grammar", [
                        ["将来医者になりたいです。", "Quero me tornar médico."],
                        ["コーヒーにします。", "Vou querer café."],
                        ["部屋が暖かくなりました。", "O quarto ficou quente."],
                        ["何にしますか？", "O que você vai querer?"],
                        ["毎日運動することにしました。", "Decidi fazer exercício todo dia."]
                    ],
                    "<strong>〜になる</strong> = mudança de estado. <strong>〜にする</strong> = decisão/escolha."
                ],
                [17, "〜ながら", "〜ながら", "enquanto faz", "n4", "grammar", [
                        ["音楽を聞きながら勉強します。", "Estudo ouvindo música."],
                        ["歩きながら話しましょう。", "Vamos conversar andando."],
                        ["何をしながら食べますか？", "O que você faz enquanto come?"],
                        ["働きながら日本語を勉強しています。", "Estudo japonês enquanto trabalho."],
                        ["テレビを見ながら料理してもいい？", "Posso cozinhar vendo TV?"]
                    ],
                    "<strong>〜ながら</strong> = duas ações simultâneas. Ação principal é o segundo verbo."
                ],
                [18, "〜たり〜たり", "〜たり〜たり", "fazer coisas como A e B", "n4", "grammar", [
                        ["週末は映画を見たり買い物したりします。", "No fim de semana vejo filmes e faço compras."],

                displayCount = 30;

            function renderWords() {
                const slice = filteredVocab.slice(0, displayCount);

                    const [rank, kanji, kana, meaning, level, type, examples, explanation] = item;
                    const hasDetail = explanation && explanation.length > 20;
                    const cardClass = type === 'grammar' ? 'grammar-card' : (type === 'particle' ?
                        'particle-card' : (type === 'verb' ? 'verb-card' : ''));
                    const tagClass = type === 'grammar' ? 'tag-grammar' : (type === 'particle' ? 'tag-particle' :
                        (type === 'verb' ? 'tag-verb' : `tag-${level}`));
                    const tagText = type === 'grammar' ? 'GRAM' : (type === 'particle' ? 'PART' : (type ===
                        'verb' ? 'VERB' : level.toUpperCase()));
                    let examplesHTML = '';
                    if (examples && examples.length > 0) {
                        const afirmativas = examples.slice(0, 2);
                        const interrogativas = examples.filter((_, i) => i >= 2);
                        if (afirmativas.length > 0) {
                            examplesHTML += '<div class="section-title">📖 Frases de exemplo</div>';
                            afirmativas.forEach(([jp, trad]) => {
                                examplesHTML +=
                                    `<div class="example-set"><div class="jp">${jp}</div><div class="translation">${trad}</div></div>`;
                            });
                        }
                        if (interrogativas.length > 0) {
                            examplesHTML += '<div class="section-title">❓ Perguntas com esta estrutura</div>';
                            interrogativas.forEach(([jp, trad]) => {
                                examplesHTML +=
                                    `<div class="example-set q"><div class="jp">${jp}</div><div class="translation">${trad}</div></div>`;
                            });
                        }
                    }
                    return `
                <div class="word-card ${cardClass}" data-index="${rank}">
                    <div class="word-header" onclick="this.parentElement.classList.toggle('open')">
                        <span class="rank">#${rank}</span>
                        <span class="kanji">${kanji}</span>
                        <span class="kana">${kana}</span>

                exp: "<strong>最初</strong> = 'no início'.<br><strong>隠しました</strong> = 'escondeu'.<br><strong>どんどん</strong> = 'cada vez mais' (onomatopeia).<br><strong>来ました</strong> = 'vieram'."
            }, {
                jp: "最後に、大きな男の人がバイクに乗って現れました。その人の名前はハグリッドでした。",
                trad: "Finalmente, um homem grande apareceu numa moto. Seu nome era Hagrid.",
                exp: "<strong>最後に</strong> = 'finalmente'.<br><strong>バイクに乗って現れました</strong> = 'apareceu montado numa moto'.<br><strong>その人の名前はハグリッドでした</strong> = 'o nome daquela pessoa era Hagrid'."
            }, {
                jp: "ハグリッドはハリーに本当のことを全部話しました。「お前は魔法使いだ」とハグリッドは言いました。",
                trad: "Hagrid contou toda a verdade. \"Você é um bruxo\", disse Hagrid.",
                exp: "<strong>ハリーに本当のことを全部話しました</strong> = 'contou toda a verdade para Harry'.<br><strong>「お前は魔法使いだ」と</strong> = citação: 'você é um bruxo'. <em>お前</em>='você' (informal/rude).<br><strong>言いました</strong> = 'disse'."
            }, {
                jp: "ハリーは最初信じられませんでしたが、ハグリッドの話を聞いて、だんだん分かってきました。",
                trad: "Harry não conseguia acreditar no início, mas ouvindo Hagrid, foi entendendo aos poucos.",
                exp: "<strong>信じられませんでした</strong> = 'não conseguia acreditar' (potencial negativo passado).<br><strong>だんだん分かってきました</strong> = 'foi entendendo gradualmente'. <em>〜てくる</em>=mudança gradual."
            }, {
                jp: "次の日、ハグリッドはハリーを連れてダイアゴン横丁に行きました。そこは魔法使いのための商店街でした。",
                trad: "No dia seguinte, Hagrid levou Harry ao Beco Diagonal, uma rua comercial para bruxos.",
                exp: "<strong>次の日</strong> = 'no dia seguinte'.<br><strong>連れて行きました</strong> = 'levou'.<br><strong>魔法使いのための商店街</strong> = 'rua comercial para bruxos'. <em>〜のための</em>=para."
            }, {
                jp: "ハリーは初めて魔法の世界を体験し、杖とローブと本、そして白いふくろうのヘドウィグを買いました。",
                trad: "Harry experimentou o mundo mágico pela primeira vez e comprou varinha, vestes, livros e Hedwig.",
                exp: "<strong>初めて魔法の世界を体験し</strong> = 'experimentou o mundo mágico pela primeira vez'.<br><strong>杖とローブと本</strong> = 'varinha, vestes e livros'. <em>と</em>=conecta itens de lista."
            }, {
                jp: "その後、ハリーはキングス・クロス駅の9と3/4番線からホグワーツ特急に乗りました。",
                trad: "Depois, Harry embarcou no Expresso de Hogwarts na plataforma 9¾ da King's Cross.",
                exp: "<strong>その後</strong> = 'depois disso'.<br><strong>9と3/4番線から</strong> = 'da plataforma 9¾'. <em>から</em>=ponto de partida.<br><strong>ホグワーツ特急に乗りました</strong> = 'embarcou no Expresso de Hogwarts'."
            }, {
                jp: "電車の中でハリーはロン・ウィーズリーとハーマイオニー・グレンジャーに出会い、すぐに親友になりました。",
                trad: "No trem, Harry conheceu Ron e Hermione, e rapidamente se tornaram melhores amigos.",
                exp: "<strong>電車の中で</strong> = 'dentro do trem'. <em>で</em>=local da ação.<br><strong>〜に出会い</strong> = 'conheceu ~'. <em>に</em> marca quem se encontra.<br><strong>すぐに親友になりました</strong> = 'rapidamente tornaram-se melhores amigos'."
            }, {
                jp: "ホグワーツに着くと、生徒たちは四つの寮に分けられました。ハリーはグリフィンドールに入りました。",
                trad: "Ao chegar, os alunos foram divididos em quatro casas. Harry entrou na Grifinória.",
                exp: "<strong>着くと</strong> = 'ao chegar'. <em>と</em>=condicional 'quando'.<br><strong>分けられました</strong> = 'foram divididos' (passivo).<br><strong>グリフィンドールに入りました</strong> = 'entrou na Grifinória'."
            }, {
                jp: "そこで彼は多くのことを学びました。魔法薬学、変身術、闇の魔術に対する防衛術などです。",
                trad: "Lá ele aprendeu muitas coisas: Poções, Transfiguração, Defesa Contra as Artes das Trevas, etc.",
                exp: "<strong>多くのことを学びました</strong> = 'aprendeu muitas coisas'.<br><strong>〜など</strong> = 'etc / entre outros'."
            }, {
                jp: "ハリーは箒に乗って空を飛ぶクィディッチというスポーツも始め、一番若いシーカーとして大活躍しました。",
                trad: "Harry também começou Quadribol e fez sucesso como o mais jovem apanhador.",
                exp: "<strong>箒に乗って空を飛ぶ</strong> = 'voar no céu montado numa vassoura'.<br><strong>クィディッチというスポーツ</strong> = 'esporte chamado Quadribol'.<br><strong>大活躍しました</strong> = 'teve grande atuação'."
            }, {
                jp: "しかし、ホグワーツには危険も潜んでいました。ヴォルデモートは完全に死んでいませんでした。",
                trad: "No entanto, havia perigos escondidos. Voldemort não estava completamente morto.",
                exp: "<strong>しかし</strong> = 'no entanto'.<br><strong>危険も潜んでいました</strong> = 'perigos também estavam escondidos'.<br><strong>完全に死んでいませんでした</strong> = 'não estava completamente morto'."
            }, {
                jp: "一年目、ハリーは賢者の石を守りました。ヴォルデモートはその石を盗もうとしましたが失敗しました。",
                trad: "No 1º ano, Harry protegeu a Pedra Filosofal. Voldemort tentou roubá-la mas falhou.",
                exp: "<strong>賢者の石を守りました</strong> = 'protegeu a Pedra Filosofal'.<br><strong>盗もうとしました</strong> = 'tentou roubar'. <em>〜うとする</em>=tentar fazer.<br><strong>失敗しました</strong> = 'falhou'."
            }, {
                jp: "二年目には「秘密の部屋」が開き、巨大な蛇が生徒たちを襲いましたが、ハリーが倒しました。",
                trad: "No 2º ano, a Câmara Secreta se abriu e uma cobra gigante atacou, mas Harry a derrotou.",
                exp: "<strong>「秘密の部屋」が開き</strong> = 'a Câmara Secreta abriu'.<br><strong>巨大な蛇が襲いました</strong> = 'uma cobra gigante atacou'.<br><strong>倒しました</strong> = 'derrotou'."
            }, {
                jp: "三年目、脱獄した囚人シリウス・ブラックが自分を狙っていることを知りましたが、実は無実でハリーの名付け親でした。",
                trad: "No 3º ano, soube que Sirius Black estava atrás dele, mas na verdade era inocente e seu padrinho.",
                exp: "<strong>脱獄した囚人</strong> = 'prisioneiro fugitivo'.<br><strong>自分を狙っている</strong> = 'está mirando em si mesmo'.<br><strong>実は無実でした</strong> = 'na verdade era inocente'."
            }, {
                jp: "四年目、ハリーは「炎のゴブレット」によって三大魔法学校対抗試合の選手に選ばれました。",
                trad: "No 4º ano, Harry foi escolhido pelo Cálice de Fogo como competidor do Torneio Tribruxo.",
                exp: "<strong>「炎のゴブレット」によって</strong> = 'pelo Cálice de Fogo'. <em>によって</em>=por meio de.<br><strong>選手に選ばれました</strong> = 'foi escolhido como competidor' (passivo)."
            }, {
                jp: "最後の試練でハリーとセドリックは一緒に優勝カップを取りましたが、それは罠で、ヴォルデモートが復活しました。",
                trad: "Na prova final, pegaram a taça juntos, mas era armadilha e Voldemort ressuscitou.",
                exp: "<strong>最後の試練で</strong> = 'na prova final'.<br><strong>罠</strong> = 'armadilha'.<br><strong>復活しました</strong> = 'ressuscitou'."
            }, {
                jp: "セドリックは殺され、ハリーは間一髪で逃げ帰りました。魔法界は二度と前と同じではなくなりました。",
                trad: "Cedric foi morto e Harry escapou por um triz. O mundo bruxo nunca mais foi o mesmo.",
                exp: "<strong>殺され</strong> = 'foi morto' (passivo).<br><strong>間一髪で逃げ帰りました</strong> = 'escapou por um triz'.<br><strong>二度と前と同じではなくなりました</strong> = 'nunca mais foi igual a antes'."
            }, {
                jp: "五年目、魔法省は復活を認めず、ハリーたちは「ダンブルドア軍団」を作って自分たちで練習しました。",
                trad: "No 5º ano, o Ministério não reconheceu a volta e Harry formou a Armada de Dumbledore.",
                exp: "<strong>認めず</strong> = 'não reconheceu'. <em>〜ず</em>=negativo formal.<br><strong>「ダンブルドア軍団」を作って</strong> = 'formou a Armada de Dumbledore'.<br><strong>自分たちで練習しました</strong> = 'praticaram por conta própria'."
            }, {
                jp: "その年の終わり、魔法省で戦いが起こり、シリウスがハリーを守るために命を落としました。",
                trad: "No final do ano, houve batalha no Ministério e Sirius morreu protegendo Harry.",
                exp: "<strong>戦いが起こり</strong> = 'batalha aconteceu'.<br><strong>守るために</strong> = 'para proteger'. <em>〜ために</em>=propósito.<br><strong>命を落としました</strong> = 'perdeu a vida'."
            }, {
                jp: "ダンブルドア先生はハリーに「愛こそが一番強い魔法だ」と教えました。",
                trad: "Dumbledore ensinou a Harry: \"O amor é a magia mais forte de todas.\"",
                exp: "<strong>「愛こそが一番強い魔法だ」と</strong> = citação. <em>こそ</em>=partícula enfática 'é justamente'.<br><strong>教えました</strong> = 'ensinou'."
            }, {
                jp: "六年目、ハリーはヴォルデモートが「分霊箱」に魂を分けて隠していることを知りました。",
                trad: "No 6º ano, Harry descobriu que Voldemort havia dividido sua alma em Horcruxes.",
                exp: "<strong>「分霊箱」に魂を分けて隠している</strong> = 'dividiu e escondeu a alma em Horcruxes'.<br><strong>知りました</strong> = 'soube/descobriu'."
            }, {
                jp: "ダンブルドアはスネイプに殺され、ハリーは学校を去り、分霊箱を探す旅に出ることを決めました。",
                trad: "Dumbledore foi morto por Snape, e Harry decidiu sair em jornada para achar as Horcruxes.",
                exp: "<strong>スネイプに殺され</strong> = 'foi morto por Snape' (passivo, agente com <em>に</em>).<br><strong>旅に出ることを決めました</strong> = 'decidiu sair em jornada'. <em>〜ことにする</em>=decidir fazer."
            }, {
                jp: "七年目、ロンとハーマイオニーと旅を続けました。食べ物も少なく危険も多く、時々喧嘩もしましたが、最後まで諦めませんでした。",
                trad: "No 7º ano, viajaram juntos. Com pouca comida e muitos perigos, brigaram às vezes, mas não desistiram.",
                exp: "<strong>旅を続けました</strong> = 'continuaram a jornada'.<br><strong>食べ物も少なく</strong> = 'comida também pouca' (forma <em>te</em> conectando razões).<br><strong>諦めませんでした</strong> = 'não desistiram'."
            }, {
                jp: "ハリーは分霊箱を一つずつ見つけて壊していきました。最後に、自分自身が分霊箱の一つだと知りました。",
                trad: "Harry foi destruindo as Horcruxes uma a uma. Por fim, soube que ele mesmo era uma.",
                exp: "<strong>一つずつ</strong> = 'uma a uma'.<br><strong>見つけて壊していきました</strong> = 'foi encontrando e destruindo'. <em>〜ていく</em>=ação contínua.<br><strong>自分自身が分霊箱の一つだと知りました</strong> = 'soube que ele mesmo era uma Horcrux'."
            }, {
                jp: "彼は自ら犠牲になることを選びました。ヴォルデモートは死の呪文をかけましたが、ハリーは死にませんでした。",
                trad: "Ele escolheu se sacrificar. Voldemort lançou o feitiço da morte, mas Harry não morreu.",
                exp: "<strong>自ら犠牲になることを選びました</strong> = 'escolheu tornar-se sacrifício'.<br><strong>死の呪文をかけました</strong> = 'lançou feitiço da morte'.<br><strong>死にませんでした</strong> = 'não morreu'."
            }, {
                jp: "なぜなら、ヴォルデモートがハリーの血を使って復活した時、母親の愛がヴォルデモートの中にも生き続けていたからです。",
                trad: "Porque, ao usar o sangue de Harry, o amor da mãe continuou vivendo também dentro de Voldemort.",
                exp: "<strong>なぜなら〜からです</strong> = 'porque ~'. Estrutura formal de explicação.<br><strong>血を使って復活した時</strong> = 'quando ressuscitou usando o sangue'.<br><strong>生き続けていた</strong> = 'continuava vivendo'."
            }, {
                jp: "最後の戦いで、ネビルが最後の分霊箱である蛇のナギニを倒し、ハリーとヴォルデモートの決闘が始まりました。",
                trad: "Na batalha final, Neville derrotou Nagini e o duelo final entre Harry e Voldemort começou.",
                exp: "<strong>最後の分霊箱である蛇のナギニ</strong> = 'Nagini, a cobra que era a última Horcrux'.<br><strong>決闘が始まりました</strong> = 'o duelo começou'."
            }, {
                jp: "ハリーは「エクスペリアームス」、ヴォルデモートは「アバダケダブラ」と叫びました。しかし、杖の主はハリーだったので、死の呪文は再びはね返りました。",
                trad: "Harry gritou 'Expelliarmus' e Voldemort 'Avada Kedavra'. Mas o mestre da varinha era Harry, e o feitiço ricocheteou.",
                exp: "<strong>「〜」と叫びました</strong> = 'gritou \"~\"'. <em>叫ぶ</em>=gritar.<br><strong>杖の主はハリーだったので</strong> = 'como o mestre da varinha era Harry'. <em>〜なので</em>=porque (explicativo).<br><strong>再びはね返りました</strong> = 'ricocheteou novamente'."
            }, {
                jp: "ヴォルデモートは自分の呪文で倒れ、ついに死にました。長い戦いが終わり、魔法界に平和が戻りました。",
                trad: "Voldemort caiu com o próprio feitiço e finalmente morreu. A paz voltou ao mundo bruxo.",
                exp: "<strong>自分の呪文で倒れ</strong> = 'caiu com o próprio feitiço'.<br><strong>ついに死にました</strong> = 'finalmente morreu'.<br><strong>平和が戻りました</strong> = 'a paz voltou'."
            }, {
                jp: "後年、ハリーはジニーと結婚し三人の子供をもうけました。ロンとハーマイオニーも幸せな家庭を築きました。",
                trad: "Anos depois, Harry casou com Gina e tiveram 3 filhos. Ron e Hermione também construíram famílias felizes.",
                exp: "<strong>後年</strong> = 'anos depois'.<br><strong>結婚し</strong> = 'casou e...'.<br><strong>子供をもうけました</strong> = 'tiveram filhos' (formal).<br><strong>幸せな家庭を築きました</strong> = 'construíram um lar feliz'."
            }, {
                jp: "ハリーの額の傷跡はもう痛むことはありませんでした。全てがうまくいきました。",
                trad: "A cicatriz de Harry nunca mais doeu. Tudo terminou bem.",
                exp: "<strong>傷跡はもう痛むことはありませんでした</strong> = 'a cicatriz nunca mais doeu'. <em>〜ことはない</em>=nunca acontece.<br><strong>全てがうまくいきました</strong> = 'tudo deu certo'."
            }, {
                jp: "これは愛と勇気と友情の物語です。",
                trad: "Esta é uma história de amor, coragem e amizade.",
                exp: "<strong>愛と勇気と友情の物語です</strong> = 'é uma história de amor, coragem e amizade'. <em>勇気</em>=coragem, <em>友情</em>=amizade."
            }];

            const hpList = document.getElementById('harryPotterList');
            if (hpList) {
                hpList.innerHTML = harryPotterText.map((item, i) => `
                <div class="word-card hp-card">
                    <div class="word-header" onclick="this.parentElement.classList.toggle('open')">
                        <span class="rank" style="font-size:0.65rem;color:#ffb300;min-width:26px;font-weight:700;text-align:right;">${i+1}</span>
                        <span class="kanji" style="font-size:0.9rem;font-weight:700;color:#fff;flex:1;">${item.jp}</span>
                        <span class="tag tag-hp">HP</span>
                        <span class="arrow" style="font-size:0.6rem;color:#ffb300;">▼</span>
                    </div>
                    <div class="word-body">
                        <div class="example-set" style="border-left-color:#ffb300;">
                            <div class="translation" style="font-size:0.85rem;color:#ffdd88;margin-bottom:4px;">${item.trad}</div>
                        </div>
                        <div class="line-explanation">${item.exp}</div>
                    </div>
                </div>`).join('');

                hpList.querySelectorAll('.word-header').forEach(header => {
                    header.addEventListener('click', function() {
                        this.parentElement.classList.toggle('open');
                    });
                });
            }
        })();
    </script>
</body>
</html>
