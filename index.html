<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japonês Essencial N5-N3 · 500% · Frases e Gramática</title>
    <style>
        :root {
            --bg: #06070f;
            --surface: #0c0e1a;
            --surface2: #131627;
            --surface3: #1a1e2f;
            --text: #e6e8f2;
            --text2: #9598b0;
            --text3: #6b6e82;
            --accent: #f04a4a;
            --accent2: #ff5c5c;
            --gold: #e2b430;
            --blue: #5b9cf5;
            --green: #43b97f;
            --purple: #9b7cf0;
            --border: #1f2338;
            --border2: #2a2f45;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            --glass: rgba(12, 14, 26, 0.85);
            --font: 'Segoe UI', 'Inter', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse at 30% 10%, rgba(240, 74, 74, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 90%, rgba(91, 156, 245, 0.04) 0%, transparent 60%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* ========== HEADER ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            transition: var(--transition);
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .logo {
            font-weight: 900;
            font-size: 1.05rem;
            color: #fff;
            white-space: nowrap;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        .logo span {
            color: var(--accent2);
        }
        .search-box {
            flex: 1;
            min-width: 170px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            border-radius: 24px;
            border: 1.5px solid var(--border2);
            background: var(--surface2);
            color: #fff;
            font-size: 0.84rem;
            outline: none;
            transition: var(--transition);
            font-family: var(--font);
        }
        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(240, 74, 74, 0.06);
            background: var(--surface3);
        }
        .search-box input::placeholder {
            color: var(--text3);
        }
        .search-box .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text3);
            pointer-events: none;
            font-size: 0.85rem;
        }
        .stats {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: var(--text2);
        }
        .stats span {
            background: var(--surface2);
            padding: 5px 10px;
            border-radius: 14px;
            white-space: nowrap;
            font-weight: 600;
            letter-spacing: 0.2px;
            border: 1px solid transparent;
            transition: var(--transition);
        }
        .stats .count-badge {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 700;
        }

        /* ========== CONTAINER ========== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 14px 16px 30px;
        }

        /* ========== FILTROS ========== */
        .controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .filter-btn {
            padding: 7px 13px;
            border-radius: 18px;
            border: 1.5px solid var(--border2);
            background: var(--surface);
            color: var(--text2);
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 700;
            transition: var(--transition);
            white-space: nowrap;
            letter-spacing: 0.2px;
            font-family: var(--font);
        }
        .filter-btn:hover {
            border-color: #555;
            color: #fff;
            background: var(--surface2);
            transform: translateY(-1px);
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 2px 12px rgba(240, 74, 74, 0.25);
        }

        /* ========== LISTA ========== */
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .word-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            position: relative;
        }
        .word-card:hover {
            border-color: var(--border2);
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }
        .word-card.open {
            border-color: var(--border2);
            box-shadow: var(--shadow);
        }
        .word-card.grammar-card {
            border-left: 4px solid #9b7cf0;
        }
        .word-card.particle-card {
            border-left: 4px solid var(--gold);
        }
        .word-card.verb-card {
            border-left: 4px solid var(--accent2);
        }
        .word-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            cursor: pointer;
            user-select: none;
            flex-wrap: wrap;
            transition: var(--transition);
        }
        .word-header:hover {
            background: rgba(255, 255, 255, 0.015);
        }
        .word-header .rank {
            font-size: 0.62rem;
            color: var(--text3);
            min-width: 28px;
            font-weight: 700;
            text-align: right;
            letter-spacing: 0.3px;
        }
        .word-header .kanji {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            min-width: 45px;
            letter-spacing: 0.3px;
        }
        .word-header .kana {
            font-size: 0.76rem;
            color: var(--text2);
            min-width: 55px;
            font-weight: 500;
        }
        .word-header .meaning {
            font-size: 0.82rem;
            color: #c5c7d6;
            flex: 1;
            min-width: 100px;
            font-weight: 500;
        }
        .word-header .arrow {
            font-size: 0.55rem;
            color: var(--text3);
            transition: transform 0.35s ease;
            flex-shrink: 0;
            width: 18px;
            text-align: center;
        }
        .word-card.open .word-header .arrow {
            transform: rotate(180deg);
            color: var(--accent2);
        }
        .word-body {
            display: none;
            padding: 0 14px 14px;
            border-top: 1px solid var(--border);
            animation: fadeSlide 0.35s ease;
        }
        .word-card.open .word-body {
            display: block;
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== EXEMPLOS ========== */
        .example-set {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin: 8px 0;
            border-left: 3px solid var(--blue);
            transition: var(--transition);
        }
        .example-set:hover {
            background: var(--surface3);
        }
        .example-set .jp {
            font-size: 0.92rem;
            color: #fff;
            margin-bottom: 3px;
            line-height: 1.7;
            font-weight: 500;
        }
        .example-set .translation {
            font-size: 0.78rem;
            color: #b0b3c4;
            line-height: 1.5;
        }
        .example-set.q {
            border-left-color: var(--accent2);
        }
        .example-set.q .jp {
            color: #ffb0b0;
        }
        .section-title {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin: 12px 0 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .line-explanation {
            font-size: 0.76rem;
            color: #a8abbf;
            line-height: 1.75;
            padding: 10px 12px;
            border-left: 3px solid #2e3350;
            background: var(--surface2);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin-top: 8px;
        }
        .line-explanation strong {
            color: var(--accent2);
            font-weight: 700;
        }
        .line-explanation em {
            color: var(--gold);
            font-style: normal;
            font-weight: 600;
        }
        .line-explanation b {
            color: #5b9cf5;
            font-weight: 600;
        }

        /* ========== TAGS ========== */
        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            flex-shrink: 0;
        }
        .tag-n5 {
            background: #132a18;
            color: #43b97f;
        }
        .tag-n4 {
            background: #0f1f30;
            color: #5b9cf5;
        }
        .tag-n3 {
            background: #2a1e08;
            color: #e2b430;
        }
        .tag-grammar {
            background: #1c0e2e;
            color: #c9aef5;
        }
        .tag-particle {
            background: #2a2006;
            color: #f5d45b;
        }
        .tag-verb {
            background: #2a0c0c;
            color: #ff8080;
        }

        /* ========== LOAD MORE ========== */
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text3);
            font-size: 1rem;
            display: none;
        }
        .no-results svg {
            display: block;
            margin: 0 auto 12px;
            opacity: 0.5;
        }
        .load-more {
            text-align: center;
            margin: 18px 0;
        }
        .load-more button {
            padding: 10px 24px;
            border-radius: 22px;
            border: 1.5px solid var(--border2);
            background: var(--surface2);
            color: #fff;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            transition: var(--transition);
            font-family: var(--font);
            letter-spacing: 0.2px;
        }
        .load-more button:hover {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 4px 18px rgba(240, 74, 74, 0.3);
            transform: translateY(-2px);
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 768px) {
            .header {
                padding: 8px 10px;
            }
            .header-inner {
                gap: 8px;
            }
            .logo {
                font-size: 0.9rem;
            }
            .word-header {
                gap: 6px;
                padding: 10px 12px;
            }
            .word-header .kanji {
                font-size: 1rem;
                min-width: 38px;
            }
            .word-header .kana {
                font-size: 0.7rem;
                min-width: 45px;
            }
            .word-header .meaning {
                font-size: 0.74rem;
                min-width: 70px;
            }
            .example-set .jp {
                font-size: 0.84rem;
            }
            .line-explanation {
                font-size: 0.73rem;
                padding: 8px 10px;
            }
            .filter-btn {
                padding: 5px 10px;
                font-size: 0.66rem;
            }
            .search-box input {
                padding: 9px 14px 9px 34px;
                font-size: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            .word-header {
                gap: 4px;
                padding: 8px 10px;
            }
            .word-header .kanji {
                font-size: 0.9rem;
                min-width: 32px;
            }
            .word-header .kana {
                font-size: 0.65rem;
                min-width: 38px;
            }
            .word-header .meaning {
                font-size: 0.7rem;
            }
            .word-header .rank {
                font-size: 0.56rem;
                min-width: 20px;
            }
            .controls {
                gap: 4px;
            }
            .filter-btn {
                padding: 4px 8px;
                font-size: 0.62rem;
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M7 12h10M12 7v10"/></svg>
                日本語<span>500%</span>
            </div>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar palavra, kanji, gramática, português...">
            </div>
            <div class="stats">
                <span class="count-badge" id="visibleCount">~600 itens</span>
                <span id="filterLabel">Todos</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="controls" id="filterControls">
            <button class="filter-btn active" data-level="all">📚 Todos</button>
            <button class="filter-btn" data-level="n5">🟢 N5</button>
            <button class="filter-btn" data-level="n4">🔵 N4</button>
            <button class="filter-btn" data-level="n3">🟠 N3</button>
            <button class="filter-btn" data-level="particle">📌 Partículas</button>
            <button class="filter-btn" data-level="grammar">🧩 Gramática</button>
            <button class="filter-btn" data-level="verb">⚡ Verbos</button>
            <button class="filter-btn" data-level="conversation">💬 Conversação</button>
        </div>

        <div class="word-list" id="wordList"></div>

        <div class="load-more" id="loadMoreArea">
            <button id="loadMoreBtn">Mostrar mais 30 ▼</button>
        </div>

        <div class="no-results" id="noResults">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            Nenhum item encontrado. Tente outro termo.
        </div>
    </main>

    <script>
        (function() {
            // ==================== BANCO DE DADOS ====================
            const data = [
                // PARTÍCULAS
                [1, "は", "は", "partícula de tópico (wa)", "n5", "particle", [
                    ["私は学生です。", "Eu sou estudante."],
                    ["日本語は面白いです。", "Japonês é interessante."],
                    ["今日は何曜日ですか？", "Que dia da semana é hoje?"],
                    ["あなたは日本人ですか？", "Você é japonês(a)?"],
                    ["これは誰のペンですか？", "De quem é esta caneta?"]
                ], `<strong>は</strong> (lê-se <em>wa</em>) marca o <strong>tópico</strong> — aquilo sobre o qual se fala.<br><br><b>🔹 QUANDO USAR:</b> Sempre que quiser estabelecer <strong>sobre o quê</strong> está falando. Use para identificar/se apresentar, descrever características e contrastar.<br><br><b>🔹 PASSO A PASSO:</b><br>1️⃣ Escolha o tópico (substantivo/pronome)<br>2️⃣ Anexe <strong>は</strong> (escreve-se は, lê-se WA)<br>3️⃣ Coloque a informação sobre o tópico<br>4️⃣ Termine com です/ます (polido) ou forma informal<br>5️⃣ Em perguntas, は continua no mesmo lugar; か no final torna interrogativo<br><br><b>🔹 CUIDADO:</b> は NÃO marca objeto direto (use を). は = tópico, が = sujeito gramatical.`],

                [2, "が", "が", "partícula de sujeito / mas", "n5", "particle", [
                    ["雨が降っています。", "Está chovendo."],
                    ["誰が来ますか？", "Quem vem?"],
                    ["猫が好きですが、犬は嫌いです。", "Gosto de gatos, mas não gosto de cachorros."],
                    ["何が食べたいですか？", "O que você quer comer?"],
                    ["お金がありますか？", "Você tem dinheiro?"]
                ], `<strong>が</strong> marca o <strong>sujeito gramatical</strong> e também funciona como <strong>conjunção 'mas'</strong>.<br><br><b>🔹 SUJEITO:</b> Use com verbos de existência (ある/いる), desejo (〜たい), habilidade (できる), gostar (好き). Objeto usa が (não を)!<br><br><b>🔹 'MAS':</b> Conecta orações contrastantes no meio da frase.<br><br><b>🔹 PASSO A PASSO:</b> 1️⃣ Sujeito + が + verbo de existência/desejo/habilidade<br>2️⃣ Para 'mas': oração informal + が + oração contrastante`],

                [3, "を", "を", "partícula de objeto direto", "n5", "particle", [
                    ["毎朝パンを食べます。", "Como pão toda manhã."],
                    ["日本語を勉強しています。", "Estou estudando japonês."],
                    ["何をしていますか？", "O que você está fazendo?"],
                    ["この本を読んだことがありますか？", "Você já leu este livro?"],
                    ["窓を開けてもいいですか？", "Posso abrir a janela?"]
                ], `<strong>を</strong> (lê-se 'o') marca o <strong>objeto direto</strong> — o que recebe a ação.<br><br><b>🔹 QUANDO USAR:</b> Com verbos transitivos: 食べる, 見る, 読む, 買う, する... Também indica local de passagem (道を歩く) ou ponto de saída (家を出る).<br><br><b>🔹 PASSO A PASSO:</b> 1️⃣ Objeto + を + verbo transitivo<br>2️⃣ Na forma polida: 本を読みます<br><br><b>⚠️</b> Verbos como 好き, できる, 分かる usam が, não を!`],

                [4, "に", "に", "localização / direção / tempo / alvo", "n5", "particle", [
                    ["7時に起きます。", "Acordo às 7h."],
                    ["学校に行きます。", "Vou à escola."],
                    ["机の上に本があります。", "Há um livro em cima da mesa."],
                    ["何時に寝ますか？", "A que horas você dorme?"],
                    ["友達にプレゼントをあげました。", "Dei um presente ao amigo."]
                ], `<strong>に</strong> é a partícula mais versátil — 4 usos principais:<br><br><b>🔹 1. PONTO TEMPORAL:</b> Horas, dias, datas. ⚠️ NÃO use com 今日, 明日, 毎日, いつ.<br><b>🔹 2. DESTINO:</b> Com verbos de movimento: 行く, 来る, 帰る.<br><b>🔹 3. LOCAL DE EXISTÊNCIA:</b> Com ある/いる.<br><b>🔹 4. ALVO/RECIPIENTE:</b> Com あげる, くれる, 教える, 会う.<br><br><b>🔹 PASSO A PASSO:</b> Substantivo (tempo/local/alvo) + に + verbo adequado.`],

                [5, "で", "で", "local de ação / meio / causa", "n5", "particle", [
                    ["図書館で勉強します。", "Estudo na biblioteca."],
                    ["電車で会社に行きます。", "Vou de trem para a empresa."],
                    ["どこで食べましょうか？", "Onde vamos comer?"],
                    ["何で来ましたか？", "Como você veio?"],
                    ["病気で学校を休みました。", "Faltei à escola por doença."]
                ], `<strong>で</strong> — 3 usos:<br><br><b>🔹 1. LOCAL DA AÇÃO:</b> Onde a atividade ocorre (図書館で勉強する).<br><b>🔹 2. MEIO/INSTRUMENTO:</b> Transporte, ferramenta, idioma (電車で, 日本語で).<br><b>🔹 3. CAUSA:</b> Motivo (病気で休む).<br><br><b>🔹 DICA:</b> に = existência, で = ação. Se há atividade, use で!`],

                [6, "と", "と", "e / com / citação", "n5", "particle", [
                    ["パンと卵を食べます。", "Como pão e ovo."],
                    ["友達と映画を見ました。", "Assisti a um filme com um amigo."],
                    ["彼は「行く」と言いました。", "Ele disse 'vou'."],
                    ["誰と来ましたか？", "Com quem você veio?"],
                    ["これとそれ、どちらがいいですか？", "Qual você prefere, este ou esse?"]
                ], `<strong>と</strong> — 3 usos:<br><br><b>🔹 1. LISTA EXAUSTIVA (e):</b> AとB = A e B (lista completa).<br><b>🔹 2. COMPANHIA (com):</b> 友達と = com o amigo.<br><b>🔹 3. CITAÇÃO:</b> Antes de 言う, 思う, 書く. Conteúdo + と + verbo.`],

                [7, "の", "の", "possessivo / nominalizador", "n5", "particle", [
                    ["これは私の本です。", "Este é meu livro."],
                    ["料理を作るのが好きです。", "Gosto de cozinhar."],
                    ["これは誰のですか？", "De quem é isto?"],
                    ["何をするのが趣味ですか？", "Qual é o seu hobby?"],
                    ["赤いのが欲しいです。", "Quero o vermelho."]
                ], `<strong>の</strong> — 3 funções:<br><br><b>🔹 1. POSSESSIVO:</b> Dono + の + item (私の本 = meu livro).<br><b>🔹 2. NOMINALIZADOR:</b> Transforma verbo em substantivo (食べるの = o ato de comer).<br><b>🔹 3. PRONOME:</b> Substitui substantivo (赤いの = o vermelho).<br><br><b>🔹 PASSO A PASSO:</b> 1️⃣ Dono + の + item<br>2️⃣ Verbo informal + の + partícula<br>3️⃣ Adjetivo + の (omitindo substantivo)`],

                [8, "も", "も", "também / inclusive / nem", "n5", "particle", [
                    ["私も行きます。", "Eu também vou."],
                    ["何もありません。", "Não há nada."],
                    ["誰も来ませんでした。", "Ninguém veio."],

                ["スマホ", "スマホ", "smartphone", "n4", "noun", [["スマホを忘れてしまった。","Esqueci meu smartphone."],["スマホで写真を撮ろう。","Vamos tirar foto com o smartphone."],["どのスマホがいいですか？","Qual smartphone é bom?"]], "Abreviação de スマートフォン."],
                ["誕生日", "たんじょうび", "aniversário", "n5", "noun", [["誕生日はいつですか？","Quando é seu aniversário?"],["誕生日おめでとう！","Feliz aniversário!"],["誕生日プレゼントをありがとう。","Obrigado pelo presente."]], "誕生日おめでとう = feliz aniversário!"],

            // Monta array completo
            const fullData = [...data];
            let rank = data.length + 1;
            moreData.forEach(w => {
                fullData.push([rank, w[0], w[1], w[2], w[3], w[4], w[5], w[6] || ""]);
                rank++;
            });

            // Elementos DOM
            const wordList = document.getElementById('wordList');
            const searchInput = document.getElementById('searchInput');
            const visibleCount = document.getElementById('visibleCount');
            const filterLabel = document.getElementById('filterLabel');
            const noResults = document.getElementById('noResults');
            const loadMoreArea = document.getElementById('loadMoreArea');
            const loadMoreBtn = document.getElementById('loadMoreBtn');

            let currentFilter = 'all';
            let displayCount = 30;
            let filteredVocab = [...fullData];

            function applyFilter() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                filteredVocab = fullData.filter(item => {
                    const [r, kanji, kana, meaning, level, type, examples, explanation] = item;
                    const allText = [kanji, kana, meaning, (explanation || '')].join(' ').toLowerCase();
                    const matchesSearch = !searchTerm || allText.includes(searchTerm) ||
                        (examples && examples.some(e => e[0].includes(searchTerm) || e[1].toLowerCase().includes(searchTerm)));
                    const matchesFilter = currentFilter === 'all' || level === currentFilter || type === currentFilter;
                    return matchesSearch && matchesFilter;
                });
                displayCount = 30;
                renderWords();
                updateStats();
            }

            function renderWords() {
                const slice = filteredVocab.slice(0, displayCount);
                wordList.innerHTML = slice.map(item => {
                    const [r, kanji, kana, meaning, level, type, examples, explanation] = item;
                    const hasDetail = explanation && explanation.length > 20;
                    const cardClass = type === 'grammar' ? 'grammar-card' : (type === 'particle' ? 'particle-card' : (type === 'verb' ? 'verb-card' : ''));
                    const tagClass = type === 'grammar' ? 'tag-grammar' : (type === 'particle' ? 'tag-particle' : (type === 'verb' ? 'tag-verb' : `tag-${level}`));
                    const tagText = type === 'grammar' ? 'GRAM' : (type === 'particle' ? 'PART' : (type === 'verb' ? 'VERB' : level.toUpperCase()));

                    let examplesHTML = '';
                    if (examples && examples.length > 0) {
                        const afirmativas = examples.slice(0, 2);
                        const interrogativas = examples.filter((_, i) => i >= 2);
                        if (afirmativas.length > 0) {
                            examplesHTML += '<div class="section-title">📖 Frases de exemplo</div>';
                            afirmativas.forEach(([jp, trad]) => {
                                examplesHTML += `<div class="example-set"><div class="jp">${jp}</div><div class="translation">${trad}</div></div>`;
                            });
                        }
                        if (interrogativas.length > 0) {
                            examplesHTML += '<div class="section-title">❓ Perguntas com esta estrutura</div>';
                            interrogativas.forEach(([jp, trad]) => {
                                examplesHTML += `<div class="example-set q"><div class="jp">${jp}</div><div class="translation">${trad}</div></div>`;
                            });
                        }
                    }

                    return `
                    <div class="word-card ${cardClass}">
                        <div class="word-header" onclick="this.parentElement.classList.toggle('open')">
                            <span class="rank">#${r}</span>
                            <span class="kanji">${kanji}</span>
                            <span class="kana">${kana}</span>
                            <span class="meaning">${meaning}</span>
                            <span class="tag ${tagClass}">${tagText}</span>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="word-body">
                            ${examplesHTML}
                            ${hasDetail ? `<div class="line-explanation">${explanation}</div>` : ''}
                        </div>
                    </div>`;
                }).join('');

                loadMoreArea.style.display = displayCount >= filteredVocab.length ? 'none' : 'flex';
                noResults.style.display = filteredVocab.length === 0 ? 'block' : 'none';
                wordList.style.display = filteredVocab.length === 0 ? 'none' : 'flex';
            }

            function updateStats() {
                visibleCount.textContent = `${filteredVocab.length} itens`;
                const labels = { all: 'Todos', n5: 'N5', n4: 'N4', n3: 'N3', particle: 'Partículas', grammar: 'Gramática', verb: 'Verbos', conversation: 'Conversação' };
                filterLabel.textContent = labels[currentFilter] || currentFilter;
            }

            // Eventos
            searchInput.addEventListener('input', applyFilter);
            loadMoreBtn.addEventListener('click', () => {
                displayCount += 30;
                if (displayCount > filteredVocab.length) displayCount = filteredVocab.length;
                renderWords();
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-level');
                    applyFilter();
                });
            });

            // Inicializar
            applyFilter();
        })();
    </script>
