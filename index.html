<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japonês Essencial N5-N3 — Vocabulário Real + Gramática para Falar</title>
    <style>
        :root {
            --bg: #08080f;
            --surface: #111122;
            --surface2: #1a1a30;
            --text: #e4e4f0;
            --text2: #a0a0b8;
            --accent: #c0392b;
            --accent2: #e74c3c;
            --gold: #d4a017;
            --blue: #4a8bf5;
            --green: #2ecc71;
            --border: #252540;
            --radius: 10px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 8, 15, 0.94);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .logo {
            font-weight: 900;
            font-size: 1.1rem;
            color: #fff;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }
        .logo span {
            color: var(--accent2);
        }
        .search-box {
            flex: 1;
            min-width: 180px;
        }
        .search-box input {
            width: 100%;
            padding: 9px 14px;
            border-radius: 22px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }
        .search-box input::placeholder {
            color: #666;
        }
        .stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.75rem;
            color: var(--text2);
        }
        .stats span {
            background: var(--surface2);
            padding: 4px 10px;
            border-radius: 12px;
            white-space: nowrap;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px 16px;
        }
        .controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .filter-btn {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text2);
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover {
            border-color: #555;
            color: #fff;
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .filter-btn.grammar-active {
            background: #6c3483;
            color: #fff;
            border-color: #6c3483;
        }
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .word-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: 0.2s;
        }
        .word-card:hover {
            border-color: #444;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
        }
        .word-card.grammar {
            border-left: 3px solid #8e44ad;
        }
        .word-card.particle-card {
            border-left: 3px solid var(--gold);
        }
        .word-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            cursor: pointer;
            user-select: none;
            flex-wrap: wrap;
        }
        .word-header .rank {
            font-size: 0.7rem;
            color: #666;
            min-width: 30px;
            font-weight: 700;
            text-align: right;
        }
        .word-header .kanji {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            min-width: 55px;
        }
        .word-header .kana {
            font-size: 0.8rem;
            color: var(--text2);
            min-width: 70px;
        }
        .word-header .meaning {
            font-size: 0.85rem;
            color: #ccc;
            flex: 1;
            min-width: 100px;
        }
        .word-header .arrow {
            font-size: 0.65rem;
            color: #555;
            transition: transform 0.3s;
        }
        .word-card.open .word-header .arrow {
            transform: rotate(180deg);
        }
        .word-body {
            display: none;
            padding: 0 14px 14px;
            border-top: 1px solid var(--border);
            animation: slideDown 0.3s ease;
        }
        .word-card.open .word-body {
            display: block;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .example-block {
            background: var(--surface2);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            border-left: 3px solid var(--accent);
        }
        .example-block .jp {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 5px;
            line-height: 1.8;
        }
        .example-block .translation {
            font-size: 0.82rem;
            color: #bbb;
            margin-bottom: 8px;
        }
        .line-explanation {
            font-size: 0.76rem;
            color: #999;
            line-height: 1.7;
            padding-left: 8px;
            border-left: 2px solid #333;
        }
        .line-explanation strong {
            color: var(--accent2);
        }
        .line-explanation em {
            color: var(--gold);
            font-style: normal;
        }
        .tag {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 9px;
            font-size: 0.6rem;
            font-weight: 700;
            margin-right: 3px;
        }
        .tag-n5 {
            background: #1a3a1a;
            color: #4caf50;
        }
        .tag-n4 {
            background: #1a2a3a;
            color: #64b5f6;
        }
        .tag-n3 {
            background: #3a2a0a;
            color: #ffb74d;
        }
        .tag-grammar {
            background: #2a0a3a;
            color: #d7bde2;
        }
        .tag-particle {
            background: #3a2a00;
            color: #ffd54f;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #555;
            font-size: 1rem;
            display: none;
        }
        .load-more {
            text-align: center;
            margin: 16px 0;
            display: block;
        }
        .load-more button {
            padding: 10px 22px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .load-more button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }
        @media (max-width: 600px) {
            .word-header {
                gap: 6px;
                padding: 10px;
            }
            .word-header .kanji {
                font-size: 1rem;
                min-width: 40px;
            }
            .word-header .kana {
                font-size: 0.7rem;
                min-width: 50px;
            }
            .word-header .meaning {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-inner">
            <div class="logo">日本語 <span>N5→N3</span> · Fala Real</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar palavra, kanji, gramática...">
            </div>
            <div class="stats">
                <span id="visibleCount">~1100 itens</span>
                <span id="filterLabel">Todos</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="controls" id="filterControls">
            <button class="filter-btn active" data-level="all">📚 Todos</button>
            <button class="filter-btn" data-level="n5">🟢 N5</button>
            <button class="filter-btn" data-level="n4">🔵 N4</button>
            <button class="filter-btn" data-level="n3">🟠 N3</button>
            <button class="filter-btn" data-level="particle">📌 Partículas</button>
            <button class="filter-btn" data-level="grammar">🧩 Gramática</button>
            <button class="filter-btn" data-level="verb">⚡ Verbos</button>
            <button class="filter-btn" data-level="conversation">💬 Conversação</button>
        </div>
        <div class="word-list" id="wordList"></div>
        <div class="load-more" id="loadMoreArea">
            <button id="loadMoreBtn">Mostrar mais 50 ▼</button>
        </div>
        <div class="no-results" id="noResults">🔍 Nenhum item encontrado. Tente outro termo.</div>
    </div>

    <script>
        (function() {
            // ========== BANCO DE DADOS: N5, N4, N3 — Vocabulário Real + Gramática ==========
            // Estrutura: [rank, kanji, kana, significado, nivel, tipo, frase_exemplo, traducao, explicacao]
            // tipo: 'particle', 'grammar', 'verb', 'adj', 'noun', 'adv', 'expression', 'conversation'

            const data = [
                // ========== PARTÍCULAS ESSENCIAIS (1-12) ==========
                [1, "は", "は", "partícula de tópico (wa)", "n5", "particle",
                    "私は学生です。日本語は面白いです。",
                    "Eu sou estudante. Japonês é interessante.",
                    "<strong>私は</strong> = 'eu (tópico)'. O <em>は</em> (wa) marca o assunto principal da frase. Tudo depois dele é informação sobre esse tópico.<br><strong>日本語は</strong> = 'japonês (tópico)'. Aqui o tópico muda para 'japonês'."
                ],
                [2, "が", "が", "partícula de sujeito / mas", "n5", "particle",
                    "雨が降っていますが、傘がありません。",
                    "Está chovendo, mas não tenho guarda-chuva.",
                    "<strong>雨が</strong> = 'chuva (sujeito)'. <em>が</em> marca o sujeito que realiza a ação ou estado.<br><strong>降っています</strong> = 'está caindo'.<br><strong>が</strong> (segundo) = conjunção 'mas'.<br><strong>傘が</strong> = 'guarda-chuva (sujeito)'. <em>が</em> com <em>ある/ない</em> marca o que existe/não existe."
                ],
                [3, "を", "を", "partícula de objeto direto", "n5", "particle",
                    "毎朝パンを食べて、コーヒーを飲みます。",
                    "Toda manhã como pão e bebo café.",
                    "<strong>パンを</strong> = 'pão (objeto)'. <em>を</em> marca o objeto direto do verbo <em>食べる</em>.<br><strong>コーヒーを</strong> = 'café (objeto)'. Objeto de <em>飲む</em>."
                ],
                [4, "に", "に", "partícula de localização / direção / tempo", "n5", "particle",
                    "7時に駅に行って、友達に会います。",
                    "Vou à estação às 7h e encontro um amigo.",
                    "<strong>7時に</strong> = 'às 7 horas'. <em>に</em> marca ponto temporal específico.<br><strong>駅に</strong> = 'à estação'. Direção/destino com verbo de movimento.<br><strong>友達に</strong> = 'com o amigo'. <em>に</em> marca o alvo/pessoa com quem se encontra."
                ],
                [5, "で", "で", "partícula de meio / local de ação", "n5", "particle",
                    "図書館で本を読んで、電車で帰ります。",
                    "Leio livro na biblioteca e volto de trem.",
                    "<strong>図書館で</strong> = 'na biblioteca'. <em>で</em> marca o local onde uma ação ocorre.<br><strong>電車で</strong> = 'de trem'. <em>で</em> indica o meio de transporte."
                ],
                [6, "と", "と", "partícula 'e' / 'com' / citação", "n5", "particle",
                    "彼は「行く」と言って、友達と出かけた。",
                    "Ele disse 'vou' e saiu com um amigo.",
                    "<strong>「行く」と</strong> = citação + <em>と</em>. Marca o que foi dito antes de <em>言う</em>.<br><strong>友達と</strong> = 'com amigo'. <em>と</em> indica companhia."
                ],
                [7, "の", "の", "partícula possessiva / nominalizador", "n5", "particle",
                    "これは私の本です。読むのが好きです。",
                    "Este é meu livro. Gosto de ler.",
                    "<strong>私の</strong> = 'meu'. <em>の</em> conecta possuidor e possuído.<br><strong>読むの</strong> = 'ler (substantivado)'. <em>の</em> transforma verbo em substantivo."
                ],
                [8, "も", "も", "também / inclusive", "n5", "particle",
                    "私もそれを見たいです。何もありません。",
                    "Eu também quero ver isso. Não há nada.",
                    "<strong>私も</strong> = 'eu também'. Substitui <em>は/が</em>.<br><strong>何も</strong> = 'nada'. Com verbo negativo, <em>も</em> reforça a negação total."
                ],
                [9, "から", "から", "de / desde / porque", "n5", "particle",
                    "ブラジルから来ました。暑いから窓を開けます。",
                    "Vim do Brasil. Como está quente, vou abrir a janela.",
                    "<strong>ブラジルから</strong> = 'do Brasil'. Origem.<br><strong>暑いから</strong> = 'porque está quente'. <em>から</em> após frase informal indica causa."
                ],
                [10, "まで", "まで", "até (limite)", "n5", "particle",
                    "家から駅まで歩いて10分です。",
                    "Da casa até a estação são 10 minutos a pé.",
                    "<strong>家から駅まで</strong> = 'da casa até a estação'. <em>から〜まで</em> = 'de ~ até'."
                ],
                [11, "へ", "へ", "partícula de direção (e)", "n5", "particle",
                    "来年、日本へ留学に行きます。",
                    "Ano que vem vou estudar no Japão.",
                    "<strong>日本へ</strong> = 'ao Japão'. <em>へ</em> (lê-se <em>e</em>) indica direção/rumo, similar a <em>に</em> mas mais poético."
                ],
                [12, "や", "や", "partícula de lista não exaustiva (e)", "n5", "particle",
                    "冷蔵庫に牛乳や卵があります。",
                    "Na geladeira tem leite, ovos, etc.",
                    "<strong>牛乳や卵</strong> = 'leite e ovos (entre outras coisas)'. <em>や</em> lista itens sugerindo que há mais."
                ],

                // ========== GRAMÁTICA ESSENCIAL (13-50) ==========
                [13, "〜ている", "〜ている", "ação contínua / estado resultante", "n5", "grammar",
                    "今、日本語を勉強しています。",
                    "Agora estou estudando japonês.",
                    "<strong>勉強して</strong> = forma <em>te</em> de <em>勉強する</em>.<br><strong>います</strong> = verbo <em>いる</em> (estar). Juntos: ação em progresso.<br>Também indica estado: <em>結婚している</em> = 'estou casado(a)' (estado resultante de ter casado)."
                ],
                [14, "〜たい", "〜たい", "querer fazer algo", "n5", "grammar",
                    "日本に行きたいです。寿司が食べたい。",
                    "Quero ir ao Japão. Quero comer sushi.",
                    "<strong>行き</strong> = raiz do verbo <em>行く</em>.<br><strong>たい</strong> = sufixo de desejo. Conjuga-se como adjetivo-<em>i</em>: <em>たくない</em> (não quero), <em>たかった</em> (queria).<br>O objeto pode usar <em>が</em> em vez de <em>を</em>: <em>寿司が食べたい</em>."
                ],
                [15, "〜ない", "〜ない", "negação informal", "n5", "grammar",
                    "今日は働かない。全然分からない。",
                    "Hoje não trabalho. Não entendo nada.",
                    "<strong>働か</strong> = raiz negativa de <em>働く</em> (grupo 1: troca <em>u</em> por <em>a</em>).<br><strong>ない</strong> = sufixo de negação informal.<br><strong>分から</strong> = raiz negativa de <em>分かる</em>.<br>Forma polida: <em>働きません</em>."
                ],
                [16, "〜た", "〜た", "passado informal", "n5", "grammar",
                    "昨日映画を見た。面白かった。",
                    "Ontem vi um filme. Foi interessante.",
                    "<strong>見た</strong> = passado de <em>見る</em> (grupo 2: troca <em>る</em> por <em>た</em>).<br><strong>面白かった</strong> = passado do adjetivo <em>面白い</em> (troca <em>い</em> por <em>かった</em>)."
                ],
                [17, "〜てください", "〜てください", "por favor faça", "n5", "grammar",
                    "ここに名前を書いてください。",
                    "Por favor, escreva seu nome aqui.",
                    "<strong>書いて</strong> = forma <em>te</em> de <em>書く</em>.<br><strong>ください</strong> = 'por favor me dê/faça'. Forma educada de pedido."
                ],
                [18, "〜てもいい", "〜てもいい", "pode fazer / permitido", "n5", "grammar",
                    "写真を撮ってもいいですか？",
                    "Posso tirar foto?",
                    "<strong>撮って</strong> = forma <em>te</em> de <em>撮る</em>.<br><strong>もいい</strong> = 'é bom/ok mesmo que'. Pergunta: <em>〜てもいいですか？</em> = 'Posso ~?'."
                ],
                [19, "〜てはいけない", "〜てはいけない", "não pode / proibido", "n5", "grammar",
                    "ここでタバコを吸ってはいけません。",
                    "Não pode fumar aqui.",
                    "<strong>吸って</strong> = forma <em>te</em> de <em>吸う</em>.<br><strong>はいけない</strong> = 'não é bom/aceitável'. Proibição formal."
                ],
                [20, "〜たことがある", "〜たことがある", "já fez / tem experiência de", "n4", "grammar",
                    "日本に行ったことがありますか？",
                    "Você já foi ao Japão?",
                    "<strong>行った</strong> = passado de <em>行く</em>.<br><strong>ことがある</strong> = 'existe o fato de ter feito'. Indica experiência de vida.<br>Resposta: <em>はい、あります</em> ou <em>いいえ、ありません</em>."
                ],
                [21, "〜つもり", "〜つもり", "pretensão / plano", "n4", "grammar",
                    "来年日本に留学するつもりです。",
                    "Pretendo estudar no Japão ano que vem.",
                    "<strong>留学する</strong> = 'estudar no exterior'.<br><strong>つもり</strong> = 'intenção/plano'. Indica algo que você decidiu fazer. Não se usa para eventos fora do seu controle."
                ],
                [22, "〜と思う", "〜とおもう", "achar que / pensar que", "n5", "grammar",
                    "この映画は面白いと思います。",
                    "Acho que este filme é interessante.",
                    "<strong>面白い</strong> = 'interessante'.<br><strong>と</strong> = partícula de citação.<br><strong>思います</strong> = 'penso'. Sempre na forma informal antes do <em>と</em>."
                ],
                [23, "〜と言う", "〜という", "dizer que / chamar-se", "n5", "grammar",
                    "彼は「大丈夫」と言いました。これは何と言いますか？",
                    "Ele disse 'tudo bem'. Como se chama isto?",
                    "<strong>「大丈夫」と</strong> = citação + <em>と</em>.<br><strong>何と</strong> = 'como (citando o nome)'. <em>〜と言う</em> = 'dizer ~ / chamar-se ~'."
                ],
                [24, "〜になる", "〜になる", "tornar-se (estado/advérbio)", "n5", "grammar",
                    "将来、医者になりたいです。",
                    "No futuro, quero me tornar médico.",
                    "<strong>医者に</strong> = 'médico (como alvo)'.<br><strong>なる</strong> = 'tornar-se'. Indica mudança de estado ou profissão.<br>Com adjetivos: <em>大きく</em> + <em>なる</em> = 'ficar grande'."
                ],
                [25, "〜にする", "〜にする", "decidir / escolher / fazer com que", "n5", "grammar",
                    "コーヒーにします。部屋を綺麗にします。",
                    "Vou querer café. Vou limpar o quarto.",
                    "<strong>コーヒーに</strong> = 'café (como escolha)'.<br><strong>します</strong> = 'faço/decido'. Indica decisão ou ação de transformar algo."
                ],
                [26, "〜ているところ", "〜ているところ", "estar no meio de fazer", "n4", "grammar",
                    "今、ご飯を食べているところです。",
                    "Estou no meio da refeição agora.",
                    "<strong>食べている</strong> = ação contínua.<br><strong>ところ</strong> = 'lugar/momento'. Juntos: 'no exato momento em que se faz algo'."
                ],
                [27, "〜たばかり", "〜たばかり", "acabou de fazer", "n4", "grammar",
                    "さっき起きたばかりです。",
                    "Acabei de acordar agora há pouco.",
                    "<strong>起きた</strong> = passado de <em>起きる</em>.<br><strong>ばかり</strong> = 'somente/apenas'. Indica que a ação ocorreu há pouco tempo."
                ],
                [28, "〜ながら", "〜ながら", "enquanto faz / fazendo simultaneamente", "n4", "grammar",
                    "音楽を聞きながら勉強します。",
                    "Estudo enquanto ouço música.",
                    "<strong>聞き</strong> = raiz de <em>聞く</em>.<br><strong>ながら</strong> = 'enquanto'. Duas ações simultâneas; a principal é o segundo verbo."
                ],
                [29, "〜たり〜たり", "〜たり〜たり", "fazer coisas como A e B (lista não exaustiva)", "n4", "grammar",
                    "週末は映画を見たり、買い物したりします。",
                    "No fim de semana faço coisas como ver filmes e fazer compras.",
                    "<strong>見たり</strong> = forma <em>tari</em> de <em>見る</em>.<br><strong>したり</strong> = forma <em>tari</em> de <em>する</em>. Lista ações exemplificativas, não exaustivas."
                ],
                [30, "〜そうだ (伝聞)", "〜そうだ", "ouvi dizer que / parece que", "n4", "grammar",

                        kanji.includes(searchTerm) ||
                        kana.includes(searchTerm) ||
                        meaning.toLowerCase().includes(searchTerm) ||
                        (translation && translation.toLowerCase().includes(searchTerm)) ||
                        (example && example.includes(searchTerm));
                    const matchesFilter =
                        currentFilter === 'all' ||
                        level === currentFilter ||
                        type === currentFilter;
                    return matchesSearch && matchesFilter;
                });
                displayCount = 50;
                renderWords();
                updateStats();
            }

                const slice = filteredVocab.slice(0, displayCount);

                    const [rank, kanji, kana, meaning, level, type, example, translation, explanation] = item;

                    const cardClass = type === 'grammar' ? 'grammar' : (type === 'particle' ? 'particle-card' :

                    const tagClass = type === 'grammar' ? 'tag-grammar' : (type === 'particle' ? 'tag-particle' :
                        `tag-${level}`);
                    const tagText = type === 'grammar' ? 'GRAM' : (type === 'particle' ? 'PART' : level.toUpperCase());
                    return `
                <div class="word-card ${cardClass}" data-index="${rank}">
                    <div class="word-header" onclick="this.parentElement.classList.toggle('open')">
                        <span class="rank">#${rank}</span>
                        <span class="kanji">${kanji}</span>
                        <span class="kana">${kana}</span>
                        <span class="meaning">${meaning}</span>
                        <span class="tag ${tagClass}">${tagText}</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="word-body">
                        <div class="example-block">
                            <div class="jp">${example}</div>
                            <div class="translation">${translation}</div>
                        </div>

                    </div>
                </div>`;
                }).join('');

                loadMoreArea.style.display = displayCount >= filteredVocab.length ? 'none' : 'block';
                noResults.style.display = filteredVocab.length === 0 ? 'block' : 'none';
                wordList.style.display = filteredVocab.length === 0 ? 'none' : 'flex';
            }

                visibleCount.textContent = `${filteredVocab.length} itens`;

                filterLabel.textContent = labels[currentFilter] || currentFilter;
            }

                displayCount += 50;
                if (displayCount > filteredVocab.length) displayCount = filteredVocab.length;
