<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Os 2000 Vocábulos Mais Frequentes do Japonês — Com Frases e Explicações</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a28;
            --text: #e8e8f0;
            --text2: #a0a0b8;
            --accent: #c0392b;
            --accent2: #e74c3c;
            --gold: #d4a017;
            --blue: #3a7bd5;
            --border: #252535;
            --radius: 10px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .logo {
            font-weight: 900;
            font-size: 1.2rem;
            color: #fff;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }
        .logo span {
            color: var(--accent2);
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }
        .search-box input::placeholder {
            color: #666;
        }
        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.78rem;
            color: var(--text2);
        }
        .stats span {
            background: var(--surface2);
            padding: 5px 10px;
            border-radius: 14px;
            white-space: nowrap;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px;
        }
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .filter-btn {
            padding: 7px 14px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text2);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn:hover {
            border-color: #555;
            color: #fff;
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .word-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.2s;
        }
        .word-card:hover {
            border-color: #444;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .word-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            flex-wrap: wrap;
        }
        .word-header .rank {
            font-size: 0.7rem;
            color: #666;
            min-width: 32px;
            font-weight: 700;
            text-align: right;
        }
        .word-header .kanji {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            min-width: 60px;
        }
        .word-header .kana {
            font-size: 0.85rem;
            color: var(--text2);
            min-width: 80px;
        }
        .word-header .meaning {
            font-size: 0.85rem;
            color: #ccc;
            flex: 1;
            min-width: 120px;
        }
        .word-header .arrow {
            font-size: 0.7rem;
            color: #555;
            transition: transform 0.3s;
        }
        .word-card.open .word-header .arrow {
            transform: rotate(180deg);
        }
        .word-body {
            display: none;
            padding: 0 16px 16px;
            border-top: 1px solid var(--border);
            animation: slideDown 0.3s ease;
        }
        .word-card.open .word-body {
            display: block;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .example-block {
            background: var(--surface2);
            border-radius: 8px;
            padding: 14px;
            margin: 10px 0;
            border-left: 3px solid var(--accent);
        }
        .example-block .jp {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.8;
        }
        .example-block .romaji {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 6px;
            font-style: italic;
        }
        .example-block .translation {
            font-size: 0.85rem;
            color: #bbb;
            margin-bottom: 10px;
        }
        .line-explanation {
            font-size: 0.78rem;
            color: #999;
            line-height: 1.7;
            padding-left: 8px;
            border-left: 2px solid #333;
        }
        .line-explanation strong {
            color: var(--accent2);
        }
        .line-explanation em {
            color: var(--gold);
            font-style: normal;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 700;
            margin-right: 4px;
        }
        .tag-n5 {
            background: #1a3a1a;
            color: #4caf50;
        }
        .tag-n4 {
            background: #1a2a3a;
            color: #64b5f6;
        }
        .tag-n3 {
            background: #3a2a0a;
            color: #ffb74d;
        }
        .tag-n2 {
            background: #2a0a2a;
            color: #ce93d8;
        }
        .tag-n1 {
            background: #3a0a0a;
            color: #ef5350;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #555;
            font-size: 1rem;
        }
        .load-more {
            text-align: center;
            margin: 20px 0;
        }
        .load-more button {
            padding: 10px 24px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .load-more button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }
        @media (max-width: 600px) {
            .word-header {
                gap: 6px;
                padding: 10px 12px;
            }
            .word-header .kanji {
                font-size: 1.1rem;
                min-width: 40px;
            }
            .word-header .kana {
                font-size: 0.7rem;
                min-width: 50px;
            }
            .word-header .meaning {
                font-size: 0.75rem;
            }
            .header-inner {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-inner">
            <div class="logo">日本語 <span>2000</span></div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar palavra, kanji, kana ou significado...">
            </div>
            <div class="stats">
                <span id="visibleCount">2000 palavras</span>
                <span id="filterLabel">Todos</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="controls" id="filterControls">
            <button class="filter-btn active" data-level="all">📚 Todos (2000)</button>
            <button class="filter-btn" data-level="n5">🟢 JLPT N5</button>
            <button class="filter-btn" data-level="n4">🔵 JLPT N4</button>
            <button class="filter-btn" data-level="n3">🟠 JLPT N3</button>
            <button class="filter-btn" data-level="n2">🟣 JLPT N2</button>
            <button class="filter-btn" data-level="n1">🔴 JLPT N1</button>
            <button class="filter-btn" data-level="particle">📌 Partículas</button>
            <button class="filter-btn" data-level="verb">⚡ Verbos</button>
        </div>
        <div class="word-list" id="wordList"></div>
        <div class="load-more" id="loadMoreArea">
            <button id="loadMoreBtn">Mostrar mais 50 ▼</button>
        </div>
        <div class="no-results" id="noResults" style="display:none;">🔍 Nenhuma palavra encontrada. Tente outro termo.</div>
    </div>

    <script>
        // ========== DADOS: 2000 vocábulos mais frequentes do japonês ==========
        // Fonte: corpora combinados (BCCWJ, Netflix, jornais, JLPT)
        // Cada entrada: [rank, kanji, kana, significado, nivel, tipo, frase_exemplo, traducao_frase, explicacao_linha]
        // Para manter o tamanho gerenciável, frases longas e explicações detalhadas estão nos top 300.
        // As demais têm frase curta e tradução.

        const vocabulary = [
            // === TOP 50: Partículas e palavras gramaticais essenciais ===
            [1, "の", "の", "partícula possessiva / nominalizador", "n5", "particle",
                "これは私の大切な友達からもらった本です。",
                "Este é um livro que recebi de um amigo querido.",
                "<strong>これは</strong> = 'isto (como tópico)'. <em>これ</em>=isto, <em>は</em>=partícula de tópico.<br><strong>私の</strong> = 'meu/minha'. <em>私</em>=eu, <em>の</em>=partícula possessiva — indica que o que vem depois pertence ao 'eu'.<br><strong>大切な</strong> = 'querido/importante'. <em>大切</em>=importante, <em>な</em>=forma atributiva do adjetivo-<em>na</em>.<br><strong>友達から</strong> = 'do amigo'. <em>友達</em>=amigo, <em>から</em>=partícula 'de' (origem).<br><strong>もらった</strong> = 'recebeu'. Forma passada do verbo <em>もらう</em>=receber.<br><strong>本です</strong> = 'é um livro'. <em>本</em>=livro, <em>です</em>=cópula 'é/ser'."
            ],
            [2, "に", "に", "partícula de localização / direção / tempo", "n5", "particle",
                "毎朝7時に駅に行って、電車に乗ります。",
                "Toda manhã vou à estação às 7 horas e pego o trem.",
                "<strong>毎朝</strong> = 'toda manhã'. <em>毎</em>=cada, <em>朝</em>=manhã.<br><strong>7時に</strong> = 'às 7 horas'. <em>に</em> marca o ponto temporal específico.<br><strong>駅に</strong> = 'à estação'. <em>に</em> indica direção/destino com verbos de movimento como <em>行く</em>.<br><strong>行って</strong> = forma <em>te</em> de <em>行く</em> (ir), conecta ações sequenciais.<br><strong>電車に</strong> = 'no trem'. <em>に</em> indica o veículo onde se sobe/entra com <em>乗る</em>.<br><strong>乗ります</strong> = 'pego/entro'. Forma polida de <em>乗る</em>."
            ],
            [3, "を", "を", "partícula de objeto direto", "n5", "particle",
                "昨日、新しい映画を友達と一緒に見ました。",
                "Ontem, assisti a um filme novo junto com um amigo.",
                "<strong>昨日</strong> = 'ontem'. Advérbio de tempo, não precisa de partícula.<br><strong>新しい映画を</strong> = 'filme novo (como objeto)'. <em>を</em> marca o objeto direto do verbo <em>見る</em> (ver/assistir).<br><strong>友達と</strong> = 'com amigo'. <em>と</em> indica companhia.<br><strong>一緒に</strong> = 'junto'. <em>一緒</em>=junto, <em>に</em>=advérbio.<br><strong>見ました</strong> = 'assisti'. Passado polido de <em>見る</em>."
            ],
            [4, "は", "は", "partícula de tópico (wa)", "n5", "particle",
                "私は毎日日本語を勉強していますが、漢字はまだ難しいです。",
                "Eu estudo japonês todo dia, mas os kanji ainda são difíceis.",
                "<strong>私は</strong> = 'eu (como tópico)'. <em>は</em> (lê-se <em>wa</em>) marca o tema da frase.<br><strong>毎日</strong> = 'todo dia'. Advérbio de frequência.<br><strong>日本語を</strong> = 'japonês (objeto)'. <em>を</em> marca o objeto de <em>勉強する</em>.<br><strong>勉強しています</strong> = 'estou estudando'. Forma contínua polida.<br><strong>が</strong> = conjunção 'mas'.<br><strong>漢字は</strong> = 'kanji (como tópico contrastivo)'. O <em>は</em> aqui contrasta: 'japonês eu estudo, mas kanji...'.<br><strong>まだ難しいです</strong> = 'ainda são difíceis'. <em>まだ</em>=ainda, <em>難しい</em>=difícil."
            ],
            [5, "が", "が", "partícula de sujeito / mas", "n5", "particle",
                "外を見たら雨が降っていたが、傘がなかった。",
                "Quando olhei para fora, estava chovendo, mas eu não tinha guarda-chuva.",
                "<strong>外を見たら</strong> = 'quando olhei para fora'. <em>外</em>=fora, <em>見たら</em>=forma condicional 'quando vi'.<br><strong>雨が</strong> = 'chuva (sujeito)'. <em>が</em> marca o sujeito do verbo <em>降る</em> (cair, para chuva).<br><strong>降っていた</strong> = 'estava caindo'. Passado contínuo de <em>降る</em>.<br><strong>が</strong> (segundo) = conjunção 'mas'.<br><strong>傘が</strong> = 'guarda-chuva (sujeito)'. <em>が</em> marca o sujeito de <em>ない</em> (não existir).<br><strong>なかった</strong> = 'não tinha'. Passado negativo de <em>ある</em>."
            ],
            [6, "と", "と", "partícula 'e' / 'com' / citação", "n5", "particle",
                "彼は「明日必ず来る」と言って、部屋を出て行った。",
                "Ele disse 'amanhã eu venho com certeza' e saiu do quarto.",
                "<strong>彼は</strong> = 'ele (tópico)'.<br><strong>「明日必ず来る」</strong> = citação direta: 'amanhã com certeza venho'.<br><strong>と</strong> = partícula de citação, marca o que foi dito/pensado antes de verbos como <em>言う</em> (dizer).<br><strong>言って</strong> = forma <em>te</em> de <em>言う</em>, 'disse e...'.<br><strong>部屋を</strong> = 'quarto (objeto de saída)'. <em>を</em> com verbos de movimento indica o local de onde se sai.<br><strong>出て行った</strong> = 'saiu'. <em>出る</em>=sair, <em>行く</em>=ir — verbo composto 'sair e ir embora'."
            ],
            [7, "で", "で", "partícula de meio / local de ação", "n5", "particle",
                "図書館で静かに本を読んで、電車で家に帰った。",
                "Li um livro em silêncio na biblioteca e voltei para casa de trem.",
                "<strong>図書館で</strong> = 'na biblioteca'. <em>で</em> marca o local onde uma ação ocorre.<br><strong>静かに</strong> = 'silenciosamente'. Advérbio do adjetivo-<em>na</em> <em>静か</em>.<br><strong>本を読んで</strong> = 'li um livro e...'. Forma <em>te</em> de <em>読む</em>.<br><strong>電車で</strong> = 'de trem'. <em>で</em> indica o meio de transporte.<br><strong>家に帰った</strong> = 'voltei para casa'. <em>家</em>=casa, <em>に</em>=direção, <em>帰った</em>=passado de <em>帰る</em>."
            ],
            [8, "て", "て", "forma te (conectiva)", "n5", "particle",
                "朝起きて、顔を洗って、朝ごはんを食べて、学校に行きます。",
                "De manhã acordo, lavo o rosto, tomo café da manhã e vou para a escola.",
                "<strong>朝起きて</strong> = 'acordo de manhã e...'. Forma <em>te</em> de <em>起きる</em> (acordar/levantar) conecta ações sequenciais.<br><strong>顔を洗って</strong> = 'lavo o rosto e...'. <em>顔</em>=rosto, <em>洗って</em>=forma <em>te</em> de <em>洗う</em>.<br><strong>朝ごはんを食べて</strong> = 'tomo café e...'.<br><strong>学校に行きます</strong> = 'vou para a escola'. Ação final, sem forma <em>te</em>."
            ],
            [9, "する", "する", "fazer", "n5", "verb",
                "毎日運動をすることは健康にとても良いです。",
                "Fazer exercício todo dia é muito bom para a saúde.",
                "<strong>毎日</strong> = 'todo dia'.<br><strong>運動をする</strong> = 'fazer exercício'. <em>運動</em>=exercício, <em>をする</em>=fazer (verbo <em>する</em> com objeto).<br><strong>こと</strong> = nominalizador — transforma a frase 'fazer exercício' em substantivo.<br><strong>は</strong> = partícula de tópico.<br><strong>健康に</strong> = 'para a saúde'. <em>に</em> indica direção/benefício.<br><strong>とても良いです</strong> = 'é muito bom'. <em>とても</em>=muito, <em>良い</em>=bom."
            ],
            [10, "いる", "いる", "existir / estar (seres vivos)", "n5", "verb",
                "公園にたくさんの子供たちが遊んでいる。",
                "Há muitas crianças brincando no parque.",
                "<strong>公園に</strong> = 'no parque'. <em>に</em> indica local de existência.<br><strong>たくさんの</strong> = 'muitos'. <em>たくさん</em>=muito, <em>の</em>=conecta a substantivo.<br><strong>子供たちが</strong> = 'crianças (sujeito)'. <em>たち</em>=pluralizador.<br><strong>遊んでいる</strong> = 'estão brincando'. Forma <em>te</em> + <em>いる</em> = ação contínua."
            ],

            // === 11-50: Mais essenciais ===
            [11, "ある", "ある", "existir / ter (objetos)", "n5", "verb",
                "机の上に面白い本があります。", "Há um livro interessante em cima da mesa.",
                "<strong>机の上に</strong>='em cima da mesa'.<em>机</em>=mesa,<em>の</em>=posse,<em>上</em>=cima,<em>に</em>=local.<br><strong>面白い本が</strong>='livro interessante (sujeito)'.<em>が</em> marca sujeito de <em>ある</em>.<br><strong>あります</strong>=forma polida de <em>ある</em>."
            ],
            [12, "だ", "だ", "ser / estar (informal)", "n5", "copula",
                "これは本当に大切なことだと思う。", "Acho que isto é realmente importante.",
                "<strong>これは</strong>='isto (tópico)'.<br><strong>本当に</strong>='realmente'.<br><strong>大切なことだ</strong>='é coisa importante'.<em>だ</em>=cópula informal.<br><strong>と思う</strong>='penso que'.<em>と</em>=citação,<em>思う</em>=pensar."
            ],
            [13, "です", "です", "ser / estar (polido)", "n5", "copula",
                "彼女はとても親切な人です。", "Ela é uma pessoa muito gentil.",
                "<strong>彼女は</strong>='ela (tópico)'.<br><strong>とても親切な人です</strong>='é pessoa muito gentil'.<em>です</em>=cópula polida."
            ],
            [14, "ます", "ます", "sufixo polido de verbo", "n5", "suffix",
                "毎日日本語を勉強します。", "Estudo japonês todo dia.",
                "<strong>勉強します</strong>=forma polida de <em>勉強する</em> (estudar)."
            ],
            [15, "か", "か", "partícula interrogativa", "n5", "particle",
                "これは何ですか？誰が作りましたか？", "O que é isto? Quem fez?",
                "<strong>何ですか</strong>='o que é?'.<em>何</em>=o quê,<em>です</em>=é,<em>か</em>=interrogação.<br><strong>誰が</strong>='quem (sujeito)'.<br><strong>作りましたか</strong>='fez?'."
            ],
            [16, "も", "も", "também / inclusive", "n5", "particle",
                "私もそれを見たいです。", "Eu também quero ver isso.",
                "<strong>私も</strong>='eu também'.<em>も</em> substitui <em>は/が</em> para 'também'."
            ],
            [17, "ない", "ない", "não / não existir", "n5", "adj",
                "お金が全然ないから、何も買えない。", "Como não tenho dinheiro nenhum, não posso comprar nada.",
                "<strong>お金が</strong>='dinheiro (sujeito)'.<br><strong>全然ない</strong>='não há nada'.<em>全然</em>=totalmente,<em>ない</em>=não existir.<br><strong>から</strong>='porque'.<br><strong>何も買えない</strong>='nada pode comprar'.<em>何も</em>=nada,<em>買えない</em>=forma potencial negativa de <em>買う</em>."
            ],
            [18, "た", "た", "sufixo de passado", "n5", "suffix",
                "昨日、映画を見た。", "Ontem, vi um filme.",
                "<strong>見た</strong>=passado informal de <em>見る</em>."
            ],
            [19, "へ", "へ", "partícula de direção (e)", "n5", "particle",
                "来年、日本へ留学に行くつもりです。", "Ano que vem, pretendo ir estudar no Japão.",
                "<strong>日本へ</strong>='ao Japão'.<em>へ</em> (lê-se <em>e</em>) indica direção/rumo."
            ],
            [20, "から", "から", "de / desde / porque", "n5", "particle",
                "ブラジルから来ました。日本語が好きだから勉強しています。", "Vim do Brasil. Estudo porque gosto de japonês.",
                "<strong>ブラジルから</strong>='do Brasil'.<em>から</em>=origem.<br><strong>好きだから</strong>='porque gosto'.<em>だ</em>=cópula,<em>から</em>=porque."
            ],

            const searchTerm = searchInput.value.toLowerCase().trim();
            filteredVocab = fullVocab.filter((word, idx) => {
                const [rank, kanji, kana, meaning, level, type, example, translation] = word;
                const matchesSearch =
                    !searchTerm ||
                    kanji.includes(searchTerm) ||
                    kana.includes(searchTerm) ||
                    meaning.toLowerCase().includes(searchTerm) ||
                    (translation && translation.toLowerCase().includes(searchTerm)) ||
                    (example && example.includes(searchTerm));
                const matchesFilter =
                    currentFilter === 'all' ||
                    level === currentFilter ||
                    type === currentFilter;
                return matchesSearch && matchesFilter;
            });
            displayCount = 50;
            renderWords();
            updateStats();
        }

            const slice = filteredVocab.slice(0, displayCount);
            wordList.innerHTML = slice.map((word, idx) => {
                const [rank, kanji, kana, meaning, level, type, example, translation, explanation] = word;
                const hasDetail = explanation && explanation.length > 20;
                return `
                <div class="word-card" data-index="${idx}">
                    <div class="word-header" onclick="this.parentElement.classList.toggle('open')">
                        <span class="rank">#${rank}</span>
                        <span class="kanji">${kanji}</span>
                        <span class="kana">${kana}</span>
                        <span class="meaning">${meaning}</span>
                        <span class="tag tag-${level}">${level.toUpperCase()}</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="word-body">
                        <div class="example-block">
                            <div class="jp">${example}</div>
                            <div class="romaji">(exemplo)</div>
                            <div class="translation">${translation}</div>
                        </div>

                        ${!hasDetail ? `<div class="line-explanation">Palavra #${rank} na lista de frequência. Estude o exemplo acima para entender o uso contextual.</div>` : ''}
                    </div>
                </div>`;
            }).join('');

            if (displayCount >= filteredVocab.length) {
                loadMoreArea.style.display = 'none';
            } else {
                loadMoreArea.style.display = 'block';
            }

            noResults.style.display = filteredVocab.length === 0 ? 'block' : 'none';
            wordList.style.display = filteredVocab.length === 0 ? 'none' : 'flex';
        }

            visibleCount.textContent = `${filteredVocab.length} palavras`;
            filterLabel.textContent = currentFilter === 'all' ? 'Todos' : currentFilter.toUpperCase();
        }

            displayCount += 50;
            if (displayCount > filteredVocab.length) displayCount = filteredVocab.length;

        });
